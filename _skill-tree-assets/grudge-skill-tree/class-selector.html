<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GRUDGE — Class Selector (Fancy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ---------- base ---------- */
:root{
  --ink:#eef2ff;
  --mute:#9aa3c7;
  --line:rgba(255,255,255,.08);
  --gold:#f6c945;
  --gold2:#ffd98a;
  --shadow:0 20px 60px -20px rgba(0,0,0,.55);
  --c-worge:#c792ff;
  --c-warrior:#ff6b57;
  --c-mage:#6aa9ff;
  --c-ranger:#6bdc8b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--ink);
  overflow-x:hidden;background:#05060c;
}

/* ---------- animated hero background ---------- */
.stage{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  transition:filter .6s ease;
}
.stage .bg{
  position:absolute;inset:-4%;
  background-size:cover;background-position:center;
  filter:saturate(1.1) brightness(.55);
  transform:scale(1.06);
  transition:opacity 1.2s ease, transform 8s ease;
  opacity:0;
}
.stage .bg.active{opacity:1;transform:scale(1.02)}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 50% 110%,rgba(0,0,0,.75),transparent 55%),
    radial-gradient(900px 500px at 10% -10%,rgba(10,15,40,.6),transparent 60%),
    linear-gradient(180deg,rgba(5,6,12,.4),rgba(5,6,12,.82));
}
/* animated stars / particles */
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen;opacity:.8}
.particles span{
  position:absolute;display:block;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:0;
  animation:drift linear infinite;
}
@keyframes drift{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  10%{opacity:.9}
  100%{opacity:0;transform:translateY(-110vh) scale(1.3)}
}
/* moving gradient sheen */
.sheen{
  position:absolute;inset:-20%;pointer-events:none;
  background:
    conic-gradient(from 0deg at 30% 40%,rgba(106,169,255,.12),transparent 25%,rgba(199,146,255,.10) 55%,transparent 80%,rgba(107,220,139,.09));
  filter:blur(60px);
  animation:spin 40s linear infinite;
  opacity:.9;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
.shell{position:relative;z-index:2;max-width:1440px;margin:0 auto;padding:26px 26px 60px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.brand{
  font-family:'Cinzel',serif;font-weight:900;letter-spacing:3px;font-size:22px;
  background:linear-gradient(90deg,var(--gold),#fff3c2 50%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(246,201,69,.15);
}
.brand small{
  display:block;font-family:'Inter',sans-serif;letter-spacing:2px;
  color:var(--mute);font-weight:600;font-size:10px;margin-top:2px;
}
.crumbs{margin-left:auto;color:var(--mute);font-size:12px;letter-spacing:2px}
.crumbs b{color:#fff}

/* race / class picker strips */
.racepicker{
  display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px;
}
@media (max-width:820px){.racepicker{grid-template-columns:repeat(3,1fr)}}
.race{
  position:relative;cursor:pointer;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;aspect-ratio:1/1;
  background:#0b0f1e;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.race:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.race .portrait{
  position:absolute;inset:0;background-size:cover;background-position:center top;
  transform:scale(1.03);transition:transform .5s ease,filter .3s ease;
  filter:saturate(.9) brightness(.9);
}
.race:hover .portrait{transform:scale(1.1);filter:saturate(1.1) brightness(1)}
.race::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(6,8,16,.8));
}
.race .label{
  position:absolute;left:0;right:0;bottom:6px;z-index:2;text-align:center;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.9);
}
.race.active{
  border-color:transparent;
  box-shadow:0 0 0 1px rgba(246,201,69,.6),0 14px 40px -14px rgba(246,201,69,.5);
}
.race.active .portrait{filter:saturate(1.2) brightness(1.05);transform:scale(1.08)}
.race.active::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 60% at 50% 120%,rgba(246,201,69,.3),transparent 60%);
}

/* class picker strip */
.classpicker{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;
}
@media (max-width:820px){.classpicker{grid-template-columns:repeat(2,1fr)}}
.cls{
  position:relative;cursor:pointer;
  border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 16px;
  background:linear-gradient(180deg,rgba(18,22,40,.75),rgba(10,12,22,.75));
  backdrop-filter:blur(14px);
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  overflow:hidden;
}
.cls:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18)}
.cls .cover{
  position:absolute;inset:0;z-index:0;opacity:.55;
  background-size:cover;background-position:center top;
  mask-image:linear-gradient(180deg,black,transparent 85%);
  transform:scale(1.05);transition:transform .6s ease,opacity .3s ease;
  filter:saturate(.9) brightness(.8);
}
.cls:hover .cover{transform:scale(1.12);opacity:.7;filter:saturate(1.1) brightness(.9)}
.cls .head{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.cls .crest{
  width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 0 30px rgba(255,255,255,.05);
}
.cls h3{margin:0;font-family:'Cinzel',serif;font-size:18px;letter-spacing:1px}
.cls .role{position:relative;z-index:1;color:var(--mute);font-size:12px;margin-top:2px;letter-spacing:.5px}
.cls p{position:relative;z-index:1;color:#cfd5f5;font-size:13px;line-height:1.45;margin:12px 0 0}
.cls.active{
  border-color:transparent;
  box-shadow:0 0 0 1px rgba(246,201,69,.55),0 22px 50px -20px rgba(246,201,69,.35);
}
.cls.active .cover{opacity:.85;filter:saturate(1.1) brightness(.95)}
.cls[data-k="mage"]    .crest{background:linear-gradient(180deg,#bcd8ff,#6aa9ff);color:#04122c}
.cls[data-k="warrior"] .crest{background:linear-gradient(180deg,#ffb3a6,#ff6b57);color:#2a0a07}
.cls[data-k="ranger"]  .crest{background:linear-gradient(180deg,#b2f0c4,#6bdc8b);color:#06220f}
.cls[data-k="worge"]   .crest{background:linear-gradient(180deg,#e1c8ff,#c792ff);color:#1c0a3a}

/* ---------- main grid ---------- */
.main{display:grid;grid-template-columns:1fr 380px;gap:20px}
@media (max-width:1100px){.main{grid-template-columns:1fr}}

.board{
  position:relative;
  border:1px solid var(--line);border-radius:22px;
  background:
    radial-gradient(600px 300px at 10% -10%,rgba(255,255,255,.06),transparent 60%),
    linear-gradient(180deg,rgba(16,20,36,.78),rgba(8,10,20,.78));
  backdrop-filter:blur(12px);
  padding:22px 22px 26px;overflow:hidden;
  box-shadow:var(--shadow);
}
.board::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center,black 65%,transparent 100%);
}
.board::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:
    radial-gradient(800px 320px at 75% 0%,rgba(255,255,255,.08),transparent 60%),
    url('https://i.imgur.com/0SOCXgv.png') center/cover no-repeat;
  mix-blend-mode:screen;
}
.board-head{display:flex;align-items:center;gap:14px;margin:2px 0 10px}
.board-head h2{margin:0;font-family:'Cinzel',serif;letter-spacing:2px;font-size:22px}
.board-head .tag{
  margin-left:auto;font-size:11px;color:var(--mute);letter-spacing:2px;
  padding:6px 10px;border:1px solid var(--line);border-radius:999px;
}
.progress{
  position:relative;height:10px;border-radius:999px;margin:10px 0 20px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden;
}
.progress .fill{
  position:absolute;inset:0;width:0%;
  background:linear-gradient(90deg,var(--gold),#fff3c2,var(--gold));
  box-shadow:0 0 30px rgba(246,201,69,.5) inset;
  transition:width .45s cubic-bezier(.2,.8,.2,1);
}
.progress .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 4px;align-items:center}
.progress .ticks span{font-size:9px;color:var(--mute);letter-spacing:2px}

/* tree */
.tree{position:relative;display:flex;flex-direction:column;gap:28px;z-index:1}
.tier{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.tier-label{
  text-align:right;color:var(--mute);font-size:11px;letter-spacing:2px;text-transform:uppercase;
  border-right:1px dashed rgba(255,255,255,.12);padding-right:14px;
}
.tier-label b{display:block;font-family:'Cinzel',serif;font-size:22px;color:#fff;letter-spacing:0;margin-bottom:2px}
.tier-label .pickhint{
  display:inline-block;margin-top:6px;font-size:10px;padding:3px 8px;
  border-radius:999px;background:rgba(255,255,255,.05);color:#cfd5f5;border:1px solid var(--line);
}
.tier.auto .pickhint{background:linear-gradient(180deg,rgba(246,201,69,.2),rgba(246,201,69,.05));color:var(--gold2);border-color:rgba(246,201,69,.35)}

.row{display:flex;flex-wrap:wrap;gap:14px}
.node{
  position:relative;width:220px;min-height:112px;cursor:pointer;
  border-radius:16px;padding:14px 14px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--line);
  transition:transform .18s ease,border-color .18s ease,box-shadow .25s ease;
  overflow:hidden;
}
.node::before{
  content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:radial-gradient(240px 100px at var(--mx,30%) var(--my,20%),rgba(255,255,255,.08),transparent 60%);
  opacity:0;transition:opacity .2s;
}
.node:hover::before{opacity:1}
.node:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.node .head{display:flex;align-items:center;gap:10px}
.node .icon{
  width:42px;height:42px;border-radius:10px;display:grid;place-items:center;overflow:hidden;
  font-size:18px;font-weight:900;color:#06101f;
  background:linear-gradient(180deg,#fff,#cfd8ff);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 6px 22px -12px rgba(255,255,255,.4);
}
.node .icon img{width:100%;height:100%;display:block;object-fit:cover}
.node .name{font-weight:800;font-size:14px;letter-spacing:.2px}
.node .desc{color:#c9cfec;font-size:12px;line-height:1.45;margin-top:6px;min-height:34px}
.node .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.node .meta span{
  font-size:10px;color:#dcdff0;background:rgba(255,255,255,.06);
  padding:2px 7px;border-radius:999px;letter-spacing:.3px;
}
.node.auto{
  border-color:rgba(246,201,69,.4);
  background:linear-gradient(180deg,rgba(246,201,69,.14),rgba(246,201,69,.02));
  box-shadow:0 10px 40px -18px rgba(246,201,69,.5);
}
.node.auto .badge{
  position:absolute;top:10px;right:10px;font-size:9px;letter-spacing:1.5px;
  background:linear-gradient(180deg,var(--gold),#d8a819);color:#201608;
  padding:3px 8px;border-radius:999px;font-weight:800;
}
.node.locked{opacity:.55;filter:saturate(.6)}
.node.selected{
  border-color:transparent;
  animation:pick .6s ease;
  box-shadow:0 0 0 1px rgba(246,201,69,.6),0 10px 50px -10px rgba(246,201,69,.55),0 0 40px rgba(246,201,69,.15);
  background:linear-gradient(180deg,rgba(246,201,69,.18),rgba(246,201,69,.04));
}
.node.selected .icon{box-shadow:0 0 18px rgba(246,201,69,.9),inset 0 0 0 1px rgba(0,0,0,.15)}
@keyframes pick{
  0%{transform:scale(1)}
  35%{transform:scale(1.06) rotate(.3deg)}
  100%{transform:scale(1)}
}
/* class themed icon colors */
.tree[data-k="mage"]    .node .icon{background:linear-gradient(180deg,#bcd8ff,#6aa9ff);color:#03132c}
.tree[data-k="warrior"] .node .icon{background:linear-gradient(180deg,#ffb3a6,#ff6b57);color:#2a0a07}
.tree[data-k="ranger"]  .node .icon{background:linear-gradient(180deg,#b2f0c4,#6bdc8b);color:#08220f}
.tree[data-k="worge"]   .node .icon{background:linear-gradient(180deg,#e1c8ff,#c792ff);color:#1c0a3a}

/* ---------- side panel ---------- */
.side{
  position:sticky;top:20px;align-self:start;
  border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(180deg,rgba(16,20,36,.85),rgba(8,10,20,.85));
  backdrop-filter:blur(14px);
  padding:18px;min-height:520px;
  box-shadow:var(--shadow);overflow:hidden;
}
.side::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:
    radial-gradient(600px 200px at 50% 0%,rgba(255,255,255,.08),transparent 60%),
    url('https://i.imgur.com/0SOCXgv.png') center/cover no-repeat;
  mix-blend-mode:screen;
}
.side > *{position:relative;z-index:1}
.side .hero{
  position:relative;height:220px;border-radius:16px;overflow:hidden;margin-bottom:16px;
  background:#0a0f20;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 18px 40px -24px rgba(0,0,0,.65);
}
.side .hero .img{
  position:absolute;inset:0;background-size:cover;background-position:center;
  transform:scale(1.05);transition:transform .8s ease;
}
.side .hero:hover .img{transform:scale(1.12)}
.side .hero::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(6,8,16,.08),rgba(6,8,16,.82)),
    radial-gradient(400px 180px at 50% 0%,rgba(255,255,255,.12),transparent 60%);
}
.side .hero .title{
  position:absolute;left:14px;right:14px;bottom:10px;z-index:2;
}
.side .hero .title h3{margin:0;font-family:'Cinzel',serif;font-size:22px;letter-spacing:1.5px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.side .hero .title span{color:#dcdff0;font-size:11px;letter-spacing:1.5px}

.build{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.bline{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);
  font-size:12px;
}
.bline.picked{border-color:rgba(246,201,69,.35);background:linear-gradient(180deg,rgba(246,201,69,.07),transparent)}
.bline .dot{width:8px;height:8px;border-radius:50%;background:#555c7a}
.bline.picked .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.bline .lbl{font-family:'Cinzel',serif;letter-spacing:1.5px;color:var(--mute);width:60px}
.bline b{color:#fff}
.bline em{margin-left:auto;color:var(--mute);font-style:normal;font-size:11px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  appearance:none;border:0;cursor:pointer;font-weight:800;font-size:13px;
  padding:11px 14px;border-radius:12px;transition:transform .1s,filter .15s,box-shadow .2s;
  letter-spacing:.5px;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.primary{
  background:linear-gradient(180deg,var(--gold),#d8a819);color:#20180a;
  box-shadow:0 10px 30px -10px rgba(246,201,69,.65);
}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:rgba(255,70,70,.12);color:#ff9aa0;border:1px solid rgba(255,70,70,.3)}

/* tooltip */
.tip{
  position:fixed;z-index:100;pointer-events:none;
  background:rgba(10,12,22,.95);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;max-width:280px;font-size:12px;line-height:1.5;color:#dfe3f7;
  box-shadow:var(--shadow);
  opacity:0;transform:translateY(6px);transition:opacity .14s ease,transform .14s ease;
}
.tip.show{opacity:1;transform:translateY(0)}
.tip b{color:#fff}
.tip .thumb{
  width:48px;height:48px;border-radius:10px;overflow:hidden;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
}
.tip .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.tip .row{display:flex;gap:10px;margin-top:6px;color:var(--mute);font-size:11px}
.tip .row span{background:rgba(255,255,255,.05);padding:2px 6px;border-radius:6px}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,40px);
  background:linear-gradient(180deg,var(--gold),#d8a819);color:#20180a;
  padding:14px 20px;border-radius:14px;font-weight:800;letter-spacing:.8px;
  box-shadow:0 20px 60px -20px rgba(246,201,69,.6);
  opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* curtain transition when confirming */
.curtain{
  position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(246,201,69,.18),rgba(5,6,12,.95) 60%);
  opacity:0;pointer-events:none;z-index:150;transition:opacity .6s ease;
}
.curtain.show{opacity:1}

/* responsive tweaks */
@media (max-width:720px){
  .tier{grid-template-columns:1fr}
  .tier-label{text-align:left;border-right:0;border-left:2px solid rgba(255,255,255,.1);padding:0 0 0 10px}
  .node{width:calc(50% - 7px)}
}
</style>
</head>
<body>

<!-- background -->
<div class="stage" id="stage">
  <div class="bg" data-k="mage"    style="background-image:url('https://i.imgur.com/vKQR4UT.png')"></div>
  <div class="bg" data-k="warrior" style="background-image:url('https://i.imgur.com/Wj2mUH2.png')"></div>
  <div class="bg" data-k="ranger"  style="background-image:url('https://i.imgur.com/5A6e5kL.png')"></div>
  <div class="bg" data-k="worge"   style="background-image:url('https://i.imgur.com/BrQH0Bx.png')"></div>
  <div class="sheen"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="shell">

  <div class="topbar">
    <div class="brand">GRUDGE WARLORDS<small>RACE · CLASS · SKILL CODEX</small></div>
    <div class="crumbs">Distribution · <b>0</b>·1·5·10·15·20</div>
  </div>

  <!-- races -->
  <div class="racepicker" id="racepicker"></div>

  <!-- classes -->
  <div class="classpicker" id="classpicker"></div>

  <!-- main grid -->
  <div class="main">
    <section class="board">
      <div class="board-head">
        <h2 id="className">Choose your Class</h2>
        <span class="tag" id="roleTag">—</span>
      </div>

      <div class="progress"><div class="fill" id="progFill"></div>
        <div class="ticks"><span>0</span><span>1</span><span>5</span><span>10</span><span>15</span><span>20</span></div>
      </div>

      <div class="tree" id="tree"></div>
    </section>

    <aside class="side">
      <div class="hero"><div class="img" id="heroImg"></div>
        <div class="title"><h3 id="heroName">—</h3><span id="heroRole">Select a class to begin</span></div>
      </div>

      <div class="build" id="build"></div>

      <div class="actions">
        <button class="btn primary" id="confirm" disabled>Lock Build</button>
        <button class="btn ghost" id="random">Randomize</button>
        <button class="btn danger" id="reset">Reset</button>
      </div>
    </aside>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast">Build Locked</div>
<div class="curtain" id="curtain"></div>

<script>
/* -------- races -------- */
const RACES = {
  elf:       {name:"Elf",       img:"https://i.imgur.com/rWEKVAw.png", blurb:"Agile & arcane-touched. +DEX, +INT."},

    host.appendChild(s);
  }
})();

const raceEl   = document.getElementById("racepicker");
const pickerEl = document.getElementById("classpicker");
const treeEl   = document.getElementById("tree");
const nameEl   = document.getElementById("className");

const heroImg  = document.getElementById("heroImg");
const heroName = document.getElementById("heroName");
const heroRole = document.getElementById("heroRole");
const buildEl  = document.getElementById("build");
const progEl   = document.getElementById("progFill");

const randomBtn  = document.getElementById("random");

function renderRaces(){
  raceEl.innerHTML = "";
  Object.entries(RACES).forEach(([k,r])=>{
    const n = document.createElement("div");
    n.className = "race"+(state.race===k?" active":"");
    n.dataset.k = k;
    n.title = `${r.name} — ${r.blurb}`;
    n.innerHTML = `
      <div class="portrait" style="background-image:url('${r.img}')"></div>
      <div class="label">${r.name}</div>`;
    n.onclick = ()=>{
      state.race = (state.race===k) ? null : k;
      save(); render();
    };
    raceEl.appendChild(n);
  });
}

function renderPicker(){
  pickerEl.innerHTML = "";
  Object.entries(CLASSES).forEach(([k,c])=>{
    const n = document.createElement("div");
    n.className = "cls"+(state.cls===k?" active":"");
    n.dataset.k = k;
    n.innerHTML = `
      <div class="cover" style="background-image:url('${c.hero}')"></div>
      <div class="head">
        <div class="crest">${c.emoji}</div>
        <div>
          <h3>${c.name}</h3>
          <div class="role">${c.role}</div>
        </div>
      </div>
      <p>${c.desc}</p>`;
    n.onclick = ()=>selectClass(k);
    pickerEl.appendChild(n);
  });
}

function selectClass(k){
  state.cls = k;
  state.picks[k] = state.picks[k] || {};
  save();
  setBg(k);
  render();
}

function setBg(k){
  document.querySelectorAll(".stage .bg").forEach(b=>{
    b.classList.toggle("active", b.dataset.k===k);
  });
}

function renderTree(){
  const k = state.cls;
  treeEl.dataset.k = k || "";
  treeEl.innerHTML = "";
  if(!k){
    treeEl.innerHTML = `<div style="padding:40px;color:var(--mute);text-align:center;font-size:14px">
      <div style="font-family:'Cinzel',serif;font-size:18px;letter-spacing:2px;color:#fff;margin-bottom:8px">⚔ Select a Class ⚔</div>
      Choose from Mage, Warrior, Ranger, or Worge above to view its skill tree.
    </div>`;
    nameEl.textContent = "Choose your Class";
    roleEl.textContent = "—";
    return;
  }
  const c = CLASSES[k];
  nameEl.textContent = c.name;
  roleEl.textContent = c.role;

  c.tiers.forEach((t,ti)=>{
    const tier = document.createElement("div");
    tier.className = "tier"+(t.auto?" auto":"");
    const picks = t.picks||1;
    tier.innerHTML = `
      <div class="tier-label">
        <b>Lv ${t.lvl}</b>${t.label}
        <div class="pickhint">${t.hint}</div>
      </div>
      <div class="row"></div>`;
    const row = tier.querySelector(".row");

    t.skills.forEach(s=>{
      const picked = isPicked(k,t.lvl,s.n);
      const iconPath = iconFor(k, s.n);
      const n = document.createElement("div");
      n.className = "node"+(t.auto?" auto":"")+(picked?" selected":"");
      n.dataset.name = s.n;
      n.innerHTML = `
        ${t.auto?`<div class="badge">AUTO</div>`:""}
        <div class="head">
          <div class="icon">${iconPath ? `<img src="${iconPath}" alt="${s.n}">` : s.i}</div>
          <div class="name">${s.n}</div>
        </div>
        <div class="desc">${s.d}</div>
        <div class="meta">${Object.entries(s.stats).slice(0,4).map(([k,v])=>`<span>${k}: ${v}</span>`).join("")}</div>`;

      n.onmousemove = (e)=>{
        const r = n.getBoundingClientRect();
        n.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");
        n.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%");
        showTip(e,s,t);
      };
      n.onmouseleave = hideTip;
      n.onclick = ()=>{
        if(t.auto) return;
        togglePick(k,t.lvl,s.n,picks);
      };
      row.appendChild(n);
    });
    treeEl.appendChild(tier);

    // auto-pick the level-0 ability (mark as picked implicitly)
    if(t.auto){
      state.picks[k] = state.picks[k]||{};
      state.picks[k][t.lvl] = [t.skills[0].n];
    }
  });
}

function isPicked(k,lvl,name){
  const arr = (state.picks[k]||{})[lvl]||[];
  return arr.includes(name);
}
function togglePick(k,lvl,name,picks){
  state.picks[k] = state.picks[k]||{};
  let arr = state.picks[k][lvl]||[];
  if(arr.includes(name)){
    arr = arr.filter(x=>x!==name);
  } else {
    arr.push(name);
    while(arr.length>picks) arr.shift();
  }
  state.picks[k][lvl] = arr;
  save();
  render();
}

function renderSide(){
  const k = state.cls;
  if(!k){
    heroName.textContent = "—";
    heroRole.textContent = "Select a class to begin";
    heroImg.style.backgroundImage = "";
    buildEl.innerHTML = `<div style="color:var(--mute);font-size:12px;padding:6px 2px">No class selected.</div>`;
    confirmBtn.disabled = true;
    progEl.style.width = "0%";
    return;
  }
  const c = CLASSES[k];
  const r = state.race ? RACES[state.race] : null;
  heroImg.style.backgroundImage = `url('${r ? r.img : PANEL_BG}')`;
  heroImg.style.backgroundPosition = r ? "center top" : "center";
  heroName.textContent = (r?r.name+" ":"")+c.name;
  heroRole.textContent = r ? (r.blurb+" · "+c.role) : c.role;

  // build list
  buildEl.innerHTML = c.tiers.map(t=>{
    const arr = (state.picks[k]||{})[t.lvl]||[];
    const names = arr.length ? arr.join(" + ") : "—";
    const picked = arr.length>0;
    return `<div class="bline ${picked?"picked":""}">
      <div class="dot"></div>
      <div class="lbl">Lv ${t.lvl}</div>
      <b>${names}</b>
      <em>${t.auto?"auto":`pick ${t.picks||1}`}</em>
    </div>`;
  }).join("");

  // progress
  const need = c.tiers.filter(t=>!t.auto).reduce((a,t)=>a+(t.picks||1),0);
  const got  = c.tiers.filter(t=>!t.auto).reduce((a,t)=>{
    return a+((state.picks[k]||{})[t.lvl]||[]).length;
  },0);
  const pct = need? Math.min(100,(got/need)*100) : 0;
  progEl.style.width = pct+"%";
  confirmBtn.disabled = got<need;
}

/* -------- tooltip -------- */
function showTip(e,s,t){
  const iconPath = iconFor(state.cls, s.n);
  tip.innerHTML = `<div style="display:flex;gap:10px;align-items:flex-start">
    ${iconPath ? `<div class="thumb"><img src="${iconPath}" alt="${s.n}"></div>` : ``}
    <div style="flex:1">
    <b>${s.n}</b> <span style="color:var(--mute);font-size:11px">· Lv ${t.lvl}</span>
    <div style="margin-top:6px">${s.d}</div>
    <div class="row">${Object.entries(s.stats).map(([k,v])=>`<span>${k}: ${v}</span>`).join("")}</div>
    </div></div>`;
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  if(x+300>innerWidth) x = e.clientX - 300 - pad;
  if(y+200>innerHeight) y = e.clientY - 200 - pad;
  tip.style.left = x+"px"; tip.style.top = y+"px";
  tip.classList.add("show");
}
function hideTip(){ tip.classList.remove("show"); }

/* -------- actions -------- */
confirmBtn.onclick = ()=>{
  const k = state.cls; if(!k) return;
  curtain.classList.add("show");
  setTimeout(()=>curtain.classList.remove("show"),900);
  const raceName = state.race ? RACES[state.race].name+" " : "";
  toastEl.textContent = "⚔ "+raceName+CLASSES[k].name+" Build Locked";
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1900);
  console.log("Locked build:", {race:state.race, class:k, picks:state.picks[k]});
};
randomBtn.onclick = ()=>{
  const k = state.cls; if(!k) return;
  const c = CLASSES[k];
  state.picks[k] = {};
  c.tiers.forEach(t=>{
    if(t.auto){ state.picks[k][t.lvl] = [t.skills[0].n]; return; }
    const picks = t.picks||1;
    const pool = [...t.skills].sort(()=>Math.random()-.5).slice(0,picks).map(s=>s.n);
    state.picks[k][t.lvl] = pool;
  });
  save(); render();
};
resetBtn.onclick = ()=>{
  if(!confirm("Reset race, class, and all selections?")) return;
  Object.assign(state,{race:null,cls:null,picks:{}}); save();
  document.querySelectorAll(".stage .bg").forEach(b=>b.classList.remove("active"));
  render();
};

/* -------- main render -------- */
function render(){ renderRaces(); renderPicker(); renderTree(); renderSide(); }
if(state.cls) setBg(state.cls);
render();
</script>
</body>
</html>
