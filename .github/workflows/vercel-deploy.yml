name: Deploy client to Vercel

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "vercel.json"
      - "vite.config.ts"
      - "script/build.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

concurrency:
  group: vercel-grudge-builder-production
  cancel-in-progress: false

jobs:
  build-smoke:
    name: Client build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Grudge-Builder
        uses: actions/checkout@v4

      - name: Vendor grudge-character-animator
        env:
          GRUDGE_MONOREPO_GIT_TOKEN: ${{ secrets.GRUDGE_MONOREPO_GIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GRUDGE_MONOREPO_GIT_TOKEN:-}" ]; then
            echo "GRUDGE_MONOREPO_GIT_TOKEN not set — /world will use stubs on Vercel"
            exit 0
          fi
          node client/ensure-grudge-monorepo.mjs
          test -f vendor/grudge-character-animator/artifacts/grudge-game/src/pages/world/WorldPage.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build client
        run: |
          npm install --legacy-peer-deps --include=dev
          npm run build:client

      - name: Optional Vercel CLI deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_VZ7uiFGiR9QBdqtzne04xygG
          VERCEL_PROJECT_ID: prj_AT8CcdGZRjg838A2B0EyYtw65Fvb
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set — Vercel Git integration handles production deploy"
            exit 0
          fi
          npx vercel@latest deploy --prod --token "$VERCEL_TOKEN"