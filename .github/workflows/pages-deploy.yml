name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build client for GitHub Pages
        run: npm run build:client
        env:
          BASE_PATH: /Grudge-Builder/
          VITE_AUTH_GATEWAY_URL: https://id.grudge-studio.com
          VITE_API_URL: https://api.grudge-studio.com
          VITE_WS_URL: wss://api.grudge-studio.com
          VITE_ASSETS_URL: https://assets.grudge-studio.com
          VITE_AI_URL: https://ale.grudge-studio.com
          VITE_BADGE_READER_URL: https://edge.grudge-studio.com

      - name: Add SPA fallback for Pages
        run: cp client/dist/index.html client/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
