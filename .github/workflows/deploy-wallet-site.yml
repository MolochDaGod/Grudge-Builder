name: Deploy wallet.grudge-studio.com

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/wallet-site/**"
      - ".github/workflows/deploy-wallet-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy grudge-wallet-site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ee475864561b02d4588180b8b9acf694
          workingDirectory: workers/wallet-site
          wranglerVersion: "4.133.0"
          command: deploy
