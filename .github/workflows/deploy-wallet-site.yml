name: Deploy wallet.grudge-studio.com

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/wallet-site/**"
      - ".github/workflows/deploy-wallet-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it in GitHub → Grudge-Builder → Settings → Secrets and variables → Actions. Create the token in Cloudflare → My Profile → API Tokens using the Edit Cloudflare Workers template. Then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy grudge-wallet-site
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ee475864561b02d4588180b8b9acf694
          workingDirectory: workers/wallet-site
          wranglerVersion: "4.34.0"
          command: deploy
