# Manual production release for Grudge Warlords.
#
# Pushing to main does not run this workflow and cannot deploy production.
# Main still builds and tests in ci.yml.
#
# Ship production only from the Actions tab:
#   1. Run workflow "Production release — Grudge Warlords".
#   2. confirm: type exactly deploy-production
#   3. git_ref: optional full commit SHA. Empty deploys the ref selected for this run.
#   4. Approve the GitHub Environment "production" on the deploy jobs
#      (Settings → Environments → production → Required reviewers).
#
# deploy-api and deploy-client both use that environment. The Railway
# deployment message records the resolved commit, and both jobs check out
# that commit rather than whatever main moves to later.

name: Production release — Grudge Warlords

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-production to ship production grudge-api and then the Vercel client. Any other value cancels.'
        required: true
        type: string
      git_ref:
        description: 'Optional full 40-character commit SHA. Leave empty to deploy the ref selected for this run.'
        required: false
        default: ''
        type: string

concurrency:
  group: grudge-production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_VZ7uiFGiR9QBdqtzne04xygG
  VERCEL_PROJECT_ID: prj_AT8CcdGZRjg838A2B0EyYtw65Fvb
  RAILWAY_PROJECT_ID: 92f039ec-2cce-4e1e-b06a-dd0ac6256d70
  RAILWAY_ENVIRONMENT: production
  RAILWAY_SERVICE: grudge-api
  RAILWAY_URL: https://grudge-api-production-0d46.up.railway.app

jobs:
  confirm:
    name: Confirm production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require typed confirmation and a commit
        id: gate
        env:
          CONFIRM: ${{ inputs.confirm }}
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "deploy-production" ]; then
            echo "::error::Production deploy refused. Type exactly deploy-production in confirm. Nothing was deployed."
            exit 1
          fi
          if [ -n "$GIT_REF" ]; then
            # Match the whole value. A line-oriented check would accept a
            # 40-hex line followed by extra output-injection text.
            if [[ ! "$GIT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::git_ref must be a full 40-character commit SHA, or empty to deploy the selected ref. Nothing was deployed."
              exit 1
            fi
            ref="${GIT_REF,,}"
            printf 'source=input\n' >> "$GITHUB_OUTPUT"
          else
            ref="$GITHUB_SHA"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The selected ref did not resolve to a commit SHA. Nothing was deployed."
              exit 1
            fi
            printf 'source=selected-ref\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.ref }}
          persist-credentials: false

      - name: Record the commit that will be deployed
        id: resolve
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.ref }}
          REF_SOURCE: ${{ steps.gate.outputs.source }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify HEAD)
          if [ "$sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out ${sha}, which is not the requested commit ${EXPECTED_SHA}. Nothing was deployed."
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Production deploy target"
            echo ""
            echo "- Selected ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit source: \`${REF_SOURCE}\`"
            echo "- Resolved commit: \`${sha}\`"
            echo "- Railway: project \`92f039ec-2cce-4e1e-b06a-dd0ac6256d70\`, environment \`production\`, service \`grudge-api\`"
            echo "- Vercel production client promote runs only after that API deploy succeeds"
            echo ""
            echo "The deploy jobs wait on the \`production\` environment. Approve them there to ship this commit."
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.confirm.outputs.sha }}
          persist-credentials: false
      - name: Test the confirmed commit
        env:
          DEPLOY_SHA: ${{ needs.confirm.outputs.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "::error::Validate checked out ${head}, not confirmed commit ${DEPLOY_SHA}."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Build client and server
        run: |
          npm run build:client
          npm run build:server
      - name: Run client acceptance tests
        run: npm run test:client -- --run
      - name: Verify production route contract
        # The stable test alias may intentionally point at the previous green
        # release while this candidate is being validated. The exact SHA is
        # checked again on the staged preview and after promotion below.
        env:
          GITHUB_SHA: ''
          PROBE_EXPECT_RELEASE: 'false'
        run: node scripts/probe-warlords-test.mjs https://test.grudge-studio.com

  deploy-api:
    needs: [confirm, validate]
    if: needs.confirm.result == 'success' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://grudge-api-production-0d46.up.railway.app
    permissions:
      contents: read
      deployments: write
    env:
      DEPLOY_SHA: ${{ needs.confirm.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.confirm.outputs.sha }}
          persist-credentials: false
      - name: Deploy only the confirmed commit
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Refusing production deploy. This job only runs from a manual workflow_dispatch."
            exit 1
          fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing production deploy without a resolved 40-character commit SHA."
            exit 1
          fi
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "::error::Checked out ${head}, but the confirmed commit is ${DEPLOY_SHA}. Nothing was deployed."
            exit 1
          fi
          echo "Confirmed production commit ${DEPLOY_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.49.2
      - name: Deploy API and wait for readiness
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          echo "Railway message: production ${DEPLOY_SHA}"
          railway up --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE" --message "production ${DEPLOY_SHA}"
          for _ in $(seq 1 36); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$RAILWAY_URL/api/health" || true)
            if [ "$code" = 200 ]; then cat /tmp/health.json; exit 0; fi
            sleep 10
          done
          cat /tmp/health.json || true
          exit 1

  deploy-client:
    needs: [confirm, validate, deploy-api]
    if: needs.confirm.result == 'success' && needs.validate.result == 'success' && needs.deploy-api.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://grudgewarlords.com
    permissions:
      contents: read
      deployments: write
    env:
      DEPLOY_SHA: ${{ needs.confirm.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.confirm.outputs.sha }}
          persist-credentials: false
      - name: Deploy only the confirmed commit
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Refusing production client promote. This job only runs from a manual workflow_dispatch."
            exit 1
          fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing production client promote without a resolved 40-character commit SHA."
            exit 1
          fi
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "::error::Checked out ${head}, but the confirmed commit is ${DEPLOY_SHA}. Nothing was promoted."
            exit 1
          fi
          echo "Confirmed production client commit ${DEPLOY_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Ensure required production domains belong to grudge-builder
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const domains = [
            'grudge.studio',
            'www.grudge.studio',
            'grudgewarlords.com',
            'www.grudgewarlords.com',
            'client.grudge-studio.com',
          ];
          const { VERCEL_TOKEN: token, VERCEL_PROJECT_ID: project, VERCEL_ORG_ID: team } = process.env;
          if (!token) throw new Error('VERCEL_TOKEN is missing.');
          if (!project) throw new Error('VERCEL_PROJECT_ID is missing.');
          if (!team) throw new Error('VERCEL_ORG_ID is missing.');
          const headers = {
            Authorization: ['Bearer', token].join(' '),
            'Content-Type': 'application/json',
          };
          for (const domain of domains) {
            const getEndpoint = `https://api.vercel.com/v9/projects/${project}/domains/${domain}?teamId=${team}`;
            let response = await fetch(getEndpoint, { headers, signal: AbortSignal.timeout(15000) });
            if (response.status === 404) {
              response = await fetch(`https://api.vercel.com/v9/projects/${project}/domains?teamId=${team}`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ name: domain }),
                signal: AbortSignal.timeout(15000),
              });
            } else if (!response.ok) {
              const detail = await response.text().catch(() => '');
              throw new Error(
                `Domain ${domain} is not attached to grudge-builder. Reassign it to project ${project} on team ${team} before running production release again (HTTP ${response.status}${detail ? `: ${detail}` : ''}).`,
              );
            }
            if (!response.ok) {
              throw new Error(`Cannot ensure project domain ${domain} (HTTP ${response.status}).`);
            }
            response = await fetch(getEndpoint, { headers, signal: AbortSignal.timeout(15000) });
            if (!response.ok) {
              throw new Error(`Cannot verify project domain ${domain} after attach (HTTP ${response.status}).`);
            }
            const data = await response.json();
            const name = data?.name ?? data?.domain?.name ?? data?.hostname;
            const projectId = data?.projectId ?? data?.project?.id ?? data?.project?.projectId;
            const teamId = data?.teamId ?? data?.team?.id;
            if ((name ?? domain) !== domain) throw new Error(`Unexpected domain response for ${domain}.`);
            if (projectId && projectId !== project) throw new Error(`Domain ${domain} is attached to ${projectId}, not ${project}.`);
            if (teamId && teamId !== team) throw new Error(`Domain ${domain} is attached to team ${teamId}, not ${team}.`);
            console.log(`Verified project domain: ${domain}`);
          }
          JS
      - name: Build and stage immutable production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          node -e "require('fs').writeFileSync('client/public/release.json', JSON.stringify({ commit: process.env.DEPLOY_SHA, builtAt: new Date().toISOString() }) + '\\n')"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          echo "RELEASE_URL=$url" >> "$GITHUB_ENV"
          GITHUB_SHA="$DEPLOY_SHA" node scripts/probe-warlords-test.mjs "$url"
      - name: Promote after preview probes
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel promote "$RELEASE_URL" --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          vercel cache purge --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          GITHUB_SHA="$DEPLOY_SHA" node scripts/probe-warlords-test.mjs https://grudge.studio
          GITHUB_SHA="$DEPLOY_SHA" node scripts/probe-warlords-test.mjs https://www.grudge.studio
          GITHUB_SHA="$DEPLOY_SHA" node scripts/probe-warlords-test.mjs https://grudgewarlords.com
          GITHUB_SHA="$DEPLOY_SHA" node scripts/probe-warlords-test.mjs https://client.grudge-studio.com
          GITHUB_SHA="$DEPLOY_SHA" node scripts/probe-warlords-test.mjs https://test.grudge-studio.com
