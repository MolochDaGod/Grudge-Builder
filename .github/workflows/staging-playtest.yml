name: Warlords staging playtest

on:
  push:
    branches: [staging]
    paths:
      - "client/**"
      - "shared/**"
      - "vercel.json"
      - "vite.config.ts"
      - "vitest.staging.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/staging-playtest.yml"
  workflow_dispatch:

concurrency:
  group: warlords-staging-playtest
  cancel-in-progress: true

env:
  PROD_RAILWAY_HOST: grudge-api-production-0d46.up.railway.app
  TEST_DOMAIN: test.grudgewarlords.com

jobs:
  multiplayer-contract:
    name: Multiplayer tutorial contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shared

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Verify canonical multiplayer Shipwreck contract
        run: npx vitest run --config vitest.staging.config.ts

      - name: Verify live transport exposes isolated Shipwreck alias
        run: |
          set -euo pipefail
          curl -fsS "https://${PROD_RAILWAY_HOST}/api/colyseus/health" -o /tmp/colyseus.json
          grep -q '"shipwreck"' /tmp/colyseus.json
          grep -q '"tutorial"' /tmp/colyseus.json
          echo "✅ live transport advertises tutorial + separate shipwreck alias"

  vercel-staging:
    name: Vercel playtest domain
    needs: multiplayer-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_VZ7uiFGiR9QBdqtzne04xygG
      VERCEL_PROJECT_ID: prj_AT8CcdGZRjg838A2B0EyYtw65Fvb
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Vendor grudge-character-animator
        env:
          GRUDGE_MONOREPO_GIT_TOKEN: ${{ secrets.GRUDGE_MONOREPO_GIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GRUDGE_MONOREPO_GIT_TOKEN:-}" ]; then
            echo "GRUDGE_MONOREPO_GIT_TOKEN not set — /world will use stubs"
            exit 0
          fi
          node client/ensure-grudge-monorepo.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Make tutorial build playtest-safe
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'client/src/pages/tutorial.tsx';
          let src = fs.readFileSync(file, 'utf8');

          const roomNeedle = 'room = await client.joinOrCreate(MULTIPLAYER_SHIPWRECK.roomName, {';
          if (!src.includes(roomNeedle)) throw new Error('tutorial room join signature changed');
          src = src.replace(
            roomNeedle,
            'room = await client.joinOrCreate(MULTIPLAYER_SHIPWRECK.legacyAlias, {'
          );

          const writes = [
            [
              'await characterAPI.update(char.id, { professionLevels: updatedLevels });',
              'await Promise.resolve(); // PLAYTEST: do not persist profession XP'
            ],
            [
              'await characterAPI.update(char.id, { inventory: inv });',
              'await Promise.resolve(); // PLAYTEST: do not persist tutorial inventory'
            ],
            [
              "void depositHarvestResource(itemId, qty, 'tutorial-harvest');",
              'void 0; // PLAYTEST: do not deposit tutorial harvest'
            ],
            [
              'void flushOfflineHarvestQueue();',
              'void 0; // PLAYTEST: do not flush persistence queue'
            ]
          ];

          for (const [from, to] of writes) {
            if (!src.includes(from)) throw new Error(`playtest safety signature missing: ${from}`);
            src = src.split(from).join(to);
          }

          fs.writeFileSync(file, src);
          console.log('✅ tutorial patched to shipwreck alias + no-persist playtest mode');
          NODE

      - name: Rewrite deployment config for test.grudgewarlords.com
        run: |
          node <<'NODE'
          const fs = require('fs');
          const host = process.env.PROD_RAILWAY_HOST;
          const testDomain = process.env.TEST_DOMAIN;
          const http = `https://${host}`;
          const ws = `wss://${host}`;
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));

          config.alias = [testDomain];
          config.env = {
            ...(config.env || {}),
            VITE_GAME_DATA_API: http,
            VITE_API_URL: http,
            VITE_COLYSEUS_URL: ws,
            VITE_GRUDGE_ENVIRONMENT: 'playtest',
            VITE_PLAYTEST: '1'
          };
          config.redirects = [
            { source: '/', destination: '/leviathan-cinema?playtest=1', permanent: false },
            ...(config.redirects || []).filter((r) => r?.source !== '/')
          ];
          config.headers = [
            ...(config.headers || []),
            {
              source: '/(.*)',
              headers: [
                { key: 'X-Robots-Tag', value: 'noindex, nofollow, noarchive' },
                { key: 'X-Grudge-Environment', value: 'playtest' }
              ]
            }
          ];

          fs.writeFileSync('vercel.json', JSON.stringify(config, null, 2) + '\n');
          console.log(`✅ playtest config -> https://${testDomain} using isolated shipwreck room`);
          NODE

      - name: Build playtest client
        run: npm run build:client

      - name: Deploy preview and bind stable test domain
        id: deploy
        run: |
          set -euo pipefail
          npx vercel@latest deploy --yes --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            echo "❌ Could not determine Vercel deployment URL"
            cat /tmp/vercel-deploy.log
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          npx vercel@latest alias set "$DEPLOY_URL" "$TEST_DOMAIN" --token "$VERCEL_TOKEN"
          echo "✅ playtest frontend: https://${TEST_DOMAIN}"

      - name: Smoke immutable deployment
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 18); do
            CODE=$(curl -sS -L -o /tmp/playtest.html -w "%{http_code}" "$URL" || true)
            if [ "$CODE" = "200" ]; then
              grep -qi '<html' /tmp/playtest.html
              echo "✅ immutable Vercel playtest deployment responds"
              exit 0
            fi
            sleep 5
          done
          echo "❌ immutable Vercel playtest deployment unavailable"
          exit 1

      - name: Verify custom test domain
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            HEADERS=$(mktemp)
            CODE=$(curl -sS -L -D "$HEADERS" -o /tmp/test-domain.html -w "%{http_code}" "https://${TEST_DOMAIN}" || true)
            if [ "$CODE" = "200" ] && grep -qi 'x-grudge-environment: playtest' "$HEADERS"; then
              echo "✅ https://${TEST_DOMAIN} is live in playtest mode"
              exit 0
            fi
            echo "test domain attempt $i/24 — HTTP $CODE"
            sleep 5
          done
          echo "❌ test domain alias/DNS is not live yet"
          exit 1
