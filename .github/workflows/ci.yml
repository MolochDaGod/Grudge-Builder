name: CI — Grudge Builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Production client and server build
        run: npm run build
      - name: Client unit tests
        run: npm run test:client
      - name: Check for hardcoded backend URLs
        run: |
          ! grep -Rn "https://api\.grudge-studio\.com" client/src/lib/api.ts client/src/lib/grudgeBackend.ts 2>/dev/null | grep -v "^[^:]*:[^:]*:[[:space:]]*//"
      - name: Verify ObjectStore connection
        run: curl --fail --silent --show-error --connect-timeout 5 --max-time 20 https://objectstore.grudge-studio.com/api/v1/classes.json >/dev/null
