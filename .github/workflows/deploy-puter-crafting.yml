name: Deploy grudge-crafting to Puter

on:
  push:
    branches: [main]
    paths:
      - 'client/public/grudge-crafting.html'
      - 'client/public/grudge-fleet.js'
      - 'scripts/grudge-puter.mjs'
      - 'scripts/lib/puter-*.mjs'
      - '.github/workflows/deploy-puter-crafting.yml'
  workflow_dispatch:

jobs:
  cdn:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Upload to R2 CDN
        working-directory: workers/cdn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci 2>/dev/null || true
          npx wrangler r2 object put grudge-assets/crafting/grudge-crafting.html \
            --file=../../client/public/grudge-crafting.html --content-type=text/html --remote
          npx wrangler r2 object put grudge-assets/js/grudge-fleet.js \
            --file=../../client/public/grudge-fleet.js --content-type=application/javascript --remote
          npx wrangler r2 object put grudge-assets/tools/puter-deploy-crafting.html \
            --file=../../client/public/puter-deploy-crafting.html --content-type=text/html --remote

  puter:
    runs-on: ubuntu-latest
    needs: cdn
    if: ${{ always() && (needs.cdn.result == 'success' || needs.cdn.result == 'failure') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to grudge-crafting.puter.site
        env:
          PUTER_TOKEN: ${{ secrets.PUTER_TOKEN }}
          PUTER_USER: ${{ secrets.PUTER_USER }}
          PUTER_PASS: ${{ secrets.PUTER_PASS }}
        run: node scripts/grudge-puter.mjs deploy crafting