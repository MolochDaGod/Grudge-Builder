<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treaty · Grudge Studio</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141820;
      --border: rgba(212, 175, 55, 0.28);
      --gold: #d4af37;
      --text: #e8eef8;
      --muted: #8b95a8;
      --input: #0a0c10;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, #1a1520, var(--panel));
    }
    header h1 {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }
    header .meta { font-size: 0.7rem; color: var(--muted); }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 8px 10px 0;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tabs button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 0.72rem;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tabs button.active {
      color: #1a1405;
      background: var(--gold);
      border-color: var(--gold);
      font-weight: 600;
    }
    .channels {
      display: flex;
      gap: 4px;
      padding: 8px 10px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .channels button {
      flex: 0 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.7rem;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .channels button.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 180px;
    }
    .msg {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .msg .who { color: var(--gold); font-weight: 600; font-size: 0.72rem; }
    .msg .when { color: var(--muted); font-size: 0.65rem; margin-left: 6px; }
    .msg .body { margin-top: 2px; word-break: break-word; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .composer input {
      flex: 1;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.85rem;
    }
    .composer button {
      background: var(--gold);
      color: #1a1405;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty, .err {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 24px 12px;
    }
    .err { color: #f87171; }
    a.link {
      color: var(--gold);
      font-size: 0.7rem;
      margin-left: auto;
      text-decoration: none;
    }
    a.link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Treaty</h1>
    <span class="meta" id="game-label">Fleet</span>
    <a class="link" id="open-full" href="https://grudgewarlords.com/treaty" target="_blank" rel="noopener">Open full app →</a>
  </header>
  <div class="tabs" id="tabs">
    <button type="button" data-tab="servers" class="active">Server chat</button>
    <button type="button" data-tab="dms">DMs</button>
    <button type="button" data-tab="friends">Friends</button>
  </div>
  <div class="channels" id="channels"></div>
  <div id="log"><div class="empty">Sign in with Grudge ID to use Treaty.</div></div>
  <div class="composer">
    <input id="input" type="text" maxlength="2000" placeholder="Message…" disabled />
    <button id="send" type="button" disabled>Send</button>
  </div>

  <script src="/grudge-fleet.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var game = (params.get("game") || "fleet").toLowerCase();
      var tab = params.get("tab") || "servers";
      var channelSlug = params.get("channel") || "";

      var elGame = document.getElementById("game-label");
      var elChannels = document.getElementById("channels");
      var elLog = document.getElementById("log");
      var elInput = document.getElementById("input");
      var elSend = document.getElementById("send");
      var elFull = document.getElementById("open-full");

      elGame.textContent = game;
      elFull.href = "https://grudgewarlords.com/treaty?from=embed&game=" + encodeURIComponent(game);

      // Capture SSO tokens from query/hash into fleet storage
      try {
        if (window.GrudgeFleet && typeof GrudgeFleet.pickupTokens === "function") {
          GrudgeFleet.pickupTokens();
        } else {
          var t = params.get("sso_token") || params.get("grudge_token") || params.get("token");
          if (t) localStorage.setItem("grudge_auth_token", t);
        }
      } catch (_) {}

      var state = { tab: tab, channels: [], channelSlug: channelSlug, poll: null };

      function token() {
        try {
          return localStorage.getItem("grudge_auth_token") || sessionStorage.getItem("grudge_auth_token");
        } catch (_) { return null; }
      }

      function apiBase() {
        // Same-origin when embedded on warlords; absolute Railway otherwise
        if (/grudgewarlords\.com|client\.grudge-studio\.com/i.test(location.hostname)) return "";
        return "https://grudge-api-production-0d46.up.railway.app";
      }

      async function api(path, init) {
        var headers = Object.assign({ Accept: "application/json" }, (init && init.headers) || {});
        var tok = token();
        if (tok) headers.Authorization = "Bearer " + tok;
        var res = await fetch(apiBase() + "/api/treaty" + path, Object.assign({}, init, { headers: headers, credentials: "include" }));
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
        return data;
      }

      function fmtTime(ts) {
        try { return new Date(ts).toLocaleTimeString(); } catch (_) { return ""; }
      }

      function renderMessages(messages) {
        if (!messages || !messages.length) {
          elLog.innerHTML = '<div class="empty">No messages yet — say hello.</div>';
          return;
        }
        elLog.innerHTML = messages.map(function (m) {
          var who = m.senderDisplayName || m.senderGrudgeId || "Player";
          return '<div class="msg"><span class="who">' + escapeHtml(who) + '</span>' +
            '<span class="when">' + fmtTime(m.createdAt) + '</span>' +
            '<div class="body">' + escapeHtml(m.content) + '</div></div>';
        }).join("");
        elLog.scrollTop = elLog.scrollHeight;
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function setComposer(on) {
        elInput.disabled = !on;
        elSend.disabled = !on;
      }

      async function loadServerChannels() {
        var data = await api("/servers?game=" + encodeURIComponent(game));
        state.channels = data.channels || [];
        if (!state.channelSlug && state.channels.length) {
          state.channelSlug = state.channels[0].slug;
        }
        elChannels.innerHTML = state.channels.map(function (c) {
          var active = c.slug === state.channelSlug ? " active" : "";
          return '<button type="button" data-slug="' + escapeHtml(c.slug) + '" class="' + active.trim() + '">' +
            escapeHtml(c.name) + "</button>";
        }).join("");
        elChannels.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.channelSlug = btn.getAttribute("data-slug");
            loadServerMessages();
            loadServerChannels();
          });
        });
      }

      async function loadServerMessages() {
        if (!state.channelSlug) return;
        var data = await api("/servers/" + encodeURIComponent(state.channelSlug) + "/messages?limit=80");
        renderMessages(data.messages || []);
        setComposer(true);
      }

      async function loadDms() {
        elChannels.innerHTML = "";
        var data = await api("/dm/threads");
        var threads = data.threads || [];
        if (!threads.length) {
          elLog.innerHTML = '<div class="empty">No DMs yet. Add friends in the full Treaty app.</div>';
          setComposer(false);
          return;
        }
        elLog.innerHTML = threads.map(function (t) {
          return '<div class="msg"><span class="who">' + escapeHtml(t.displayName || t.grudgeId || "Friend") + '</span>' +
            (t.unread ? ' <span class="when">(' + t.unread + ' unread)</span>' : '') +
            '<div class="body">' + escapeHtml(t.lastMessage || "—") + "</div></div>";
        }).join("");
        setComposer(false);
      }

      async function loadFriends() {
        elChannels.innerHTML = "";
        var data = await api("/social");
        var friends = (data.friends || []).filter(function (f) { return f.status === "accepted"; });
        var pending = data.pendingIncoming || [];
        var html = "";
        if (pending.length) {
          html += '<div class="empty">Pending requests: ' + pending.length + " (open full app to accept)</div>";
        }
        if (!friends.length) {
          html += '<div class="empty">No friends yet. Use full Treaty app to add by Grudge ID.</div>';
        } else {
          html += friends.map(function (f) {
            return '<div class="msg"><span class="who">' + escapeHtml(f.displayName || f.grudgeId || "Friend") + "</span>" +
              '<div class="body">' + escapeHtml(f.grudgeId || "") + "</div></div>";
          }).join("");
        }
        elLog.innerHTML = html;
        setComposer(false);
      }

      async function refresh() {
        if (!token()) {
          elLog.innerHTML = '<div class="empty">Sign in with Grudge ID to use Treaty.<br/><a class="link" href="https://id.grudge-studio.com/login?redirect_uri=' +
            encodeURIComponent(location.href) + '">Sign in</a></div>';
          setComposer(false);
          return;
        }
        try {
          if (state.tab === "servers") {
            await loadServerChannels();
            await loadServerMessages();
          } else if (state.tab === "dms") {
            await loadDms();
          } else {
            await loadFriends();
          }
        } catch (e) {
          elLog.innerHTML = '<div class="err">' + escapeHtml(e.message || String(e)) + "</div>";
        }
      }

      document.getElementById("tabs").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        state.tab = btn.getAttribute("data-tab");
        document.querySelectorAll("#tabs button").forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        refresh();
      });

      elSend.addEventListener("click", async function () {
        var text = elInput.value.trim();
        if (!text || !state.channelSlug || state.tab !== "servers") return;
        elSend.disabled = true;
        try {
          await api("/servers/" + encodeURIComponent(state.channelSlug) + "/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: text }),
          });
          elInput.value = "";
          await loadServerMessages();
        } catch (e) {
          alert(e.message || String(e));
        } finally {
          elSend.disabled = false;
        }
      });

      elInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") elSend.click();
      });

      refresh();
      state.poll = setInterval(function () {
        if (state.tab === "servers" && token()) loadServerMessages().catch(function () {});
      }, 5000);
    })();
  </script>
</body>
</html>
