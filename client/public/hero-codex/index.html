<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Codex | Grudge Warlords</title>
  <meta name="description" content="Canonical Hero Codex of Grudge Warlords. 24 roster heroes (First Last names) across Crusade, Legion, and Fabled — plus pirate legends. Unique portraits, lore, dialogue, and quests." />
  <meta property="og:title" content="Hero Codex | Grudge Warlords" />
  <meta property="og:description" content="Canonical roster: Aurion Solbrand, Sigurd Ironcrown, Scourge Faithbearer, and the full Warlords cast." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e1a;
      color: #ccc;
      font-family: 'Jost', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .serif { font-family: 'Cinzel', serif; }

    .header {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 12px 16px;
      background: rgba(10,14,26,0.95);
      border-bottom: 1px solid rgba(255,215,0,0.15);
      backdrop-filter: blur(8px);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header h1 { font-family: 'Cinzel', serif; color: #ffd700; font-size: 1.15rem; }
    .header .sub { font-size: 10px; color: #888; }
    .header .canon-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 999px;
      border: 1px solid rgba(246,201,69,0.45); color: #f6c945; background: rgba(246,201,69,0.08);
    }
    .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-select {
      font-size: 11px; padding: 6px 8px; border-radius: 6px; appearance: none; cursor: pointer;
      background: rgba(255,255,255,0.06); color: #ccc; border: 1px solid rgba(255,255,255,0.1); outline: none;
      font-family: 'Jost', sans-serif;
    }
    .filter-select option { background: #1a1e2e; color: #ccc; }

    .loading, .error {
      text-align: center; padding: 80px 20px; color: #888; font-size: 14px;
    }
    .error { color: #f87171; }

    .grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
      padding: 24px;
    }

    .card {
      position: relative; cursor: pointer; width: 220px;
      border-radius: 12px; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card .top-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 2; }
    .card .bottom-line { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; z-index: 2; }

    .card-portrait { position: relative; height: 200px; overflow: hidden; }
    .card-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .card-portrait .overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 35%, transparent 65%); }
    .card-faction-tag {
      position: absolute; top: 8px; right: 8px; padding: 2px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 700; background: rgba(0,0,0,0.7);
    }
    .card-sector-tag {
      position: absolute; top: 8px; left: 8px; padding: 2px 6px; border-radius: 4px;
      font-size: 8px; font-weight: 600; background: rgba(0,0,0,0.65); color: #bbb; max-width: 110px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-name-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; }
    .card-name { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .card-name-first { display: block; }
    .card-name-last { display: block; font-size: 11px; font-weight: 600; opacity: 0.92; letter-spacing: 0.04em; }
    .card-title { font-size: 10px; font-style: italic; }

    .card-body { padding: 10px 12px; background: rgba(0,0,0,0.3); }
    .card-body .stars { display: flex; justify-content: center; gap: 2px; margin-bottom: 6px; }

    .stat-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 4px;
      padding: 5px 6px; border-radius: 6px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    }
    .stat { display: flex; align-items: center; gap: 3px; }
    .stat span { font-size: 10px; font-weight: 700; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .card-meta { font-size: 9px; color: #888; }
    .card-loadout {
      font-size: 9px; font-weight: 600; letter-spacing: 0.04em;
      text-align: center; margin-bottom: 6px; color: #c4b5fd;
      text-transform: uppercase;
    }
    .card-abilities { display: flex; gap: 4px; }
    .ability-icon-box {
      width: 24px; height: 24px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .ability-icon-box img { width: 13px; height: 13px; image-rendering: pixelated; }

    .star-icon {
      display: inline-block; width: 12px; height: 12px;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    }
    .modal-overlay.hidden { display: none; }

    .modal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      padding: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); color: #fff;
      border: none; cursor: pointer; font-size: 20px; line-height: 1; z-index: 2;
    }
    .modal-nav.prev { left: 16px; }
    .modal-nav.next { right: 16px; }

    .modal-card {
      position: relative; display: flex; flex-direction: row; gap: 0;
      max-width: 940px; width: 95vw; max-height: 90vh;
      border-radius: 16px; overflow: hidden;
    }
    @media (max-width: 768px) { .modal-card { flex-direction: column; } }

    .modal-portrait { position: relative; width: 340px; flex-shrink: 0; min-height: 300px; }
    @media (max-width: 768px) { .modal-portrait { width: 100%; min-height: 200px; max-height: 280px; } }
    .modal-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; min-height: 300px; max-height: 500px; }
    .modal-portrait .gradient-bottom { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 30%, transparent 60%); }
    .modal-portrait .gradient-right { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 60%, rgba(0,0,0,0.8) 100%); }
    @media (max-width: 768px) { .modal-portrait .gradient-right { display: none; } }

    .modal-tags { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .modal-tag { padding: 4px 8px; border-radius: 6px; background: rgba(0,0,0,0.75); font-size: 10px; font-weight: 700; }
    .modal-name-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; }
    .modal-name { font-family: 'Cinzel', serif; font-size: 1.25rem; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .modal-title-text { font-size: 14px; font-style: italic; }
    .modal-race-info { display: flex; align-items: center; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
    .modal-race-info span { font-size: 11px; }

    .modal-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .modal-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); overflow-x: auto; }
    .modal-tab {
      flex: 1; padding: 10px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; background: transparent; border: none; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.2s;
      font-family: 'Jost', sans-serif; color: #888; white-space: nowrap; min-width: 70px;
    }
    .modal-tab.active { background: rgba(255,255,255,0.03); }

    .modal-content { flex: 1; overflow-y: auto; padding: 16px; max-height: 420px; }
    .modal-content > * + * { margin-top: 16px; }

    .panel {
      padding: 12px; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    }
    .panel-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: #888; margin-bottom: 6px; }

    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .stat-box .stat-val { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .stat-box .stat-label { font-size: 9px; text-transform: uppercase; color: #888; }

    .ability-row {
      display: flex; align-items: flex-start; gap: 12px; padding: 10px; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    }
    .ability-icon-lg {
      width: 36px; height: 36px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ability-icon-lg img { width: 20px; height: 20px; image-rendering: pixelated; }
    .ability-info { flex: 1; min-width: 0; }
    .ability-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ability-name { font-size: 12px; font-weight: 700; color: #ddd; }
    .ability-cost { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .ability-desc { font-size: 10px; color: #999; margin-top: 2px; }

    .combat-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 2px 0; gap: 12px; }
    .combat-row .label { color: #aaa; }
    .combat-row .value { color: #ddd; text-align: right; }

    .sw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sw-list { list-style: none; }
    .sw-list li { font-size: 10px; color: #aaa; display: flex; align-items: flex-start; gap: 4px; padding: 2px 0; }

    .trait-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 0; gap: 8px; }
    .trait-name { font-size: 12px; font-weight: 600; color: #ddd; }
    .trait-effect { font-size: 10px; font-weight: 600; text-align: right; }

    .dialogue-line { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px; }
    .dialogue-key { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 4px; }
    .dialogue-text { font-size: 12px; color: #ddd; line-height: 1.5; font-style: italic; }

    .quest-row { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px; }
    .quest-title { font-size: 12px; font-weight: 700; color: #eee; }
    .quest-desc { font-size: 11px; color: #999; margin-top: 2px; }

    .rel-row { font-size: 11px; color: #bbb; padding: 4px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .rel-type { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

    .no-results { text-align: center; padding: 80px 20px; color: #666; font-size: 14px; }
    .svg-icon { display: inline-block; vertical-align: middle; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div>
      <h1>Hero Codex</h1>
      <p class="sub"><span id="count">0</span> of <span id="total">0</span> · Canonical Warlords roster</p>
    </div>
    <span class="canon-badge">HERO_ROSTER SSOT</span>
  </div>
  <div class="filters">
    <select id="filter-race" class="filter-select" onchange="applyFilters()">
      <option value="All">Race: All</option>
      <option value="Human">Race: Human</option>
      <option value="Barbarian">Race: Barbarian</option>
      <option value="Dwarf">Race: Dwarf</option>
      <option value="Elf">Race: Elf</option>
      <option value="Orc">Race: Orc</option>
      <option value="Undead">Race: Undead</option>
    </select>
    <select id="filter-class" class="filter-select" onchange="applyFilters()">
      <option value="All">Class: All</option>
      <option value="Warrior">Class: Warrior</option>
      <option value="Mage">Class: Mage</option>
      <option value="Ranger">Class: Ranger</option>
      <option value="Worges">Class: Worges</option>
      <option value="Shaman">Class: Shaman</option>
      <option value="Necromancer">Class: Necromancer</option>
      <option value="Rogue">Class: Rogue</option>
      <option value="Cleric">Class: Cleric</option>
      <option value="Legend">Class: Legend</option>
    </select>
    <select id="filter-faction" class="filter-select" onchange="applyFilters()">
      <option value="All">Faction: All</option>
      <option value="Crusade">Faction: Crusade</option>
      <option value="Legion">Faction: Legion</option>
      <option value="Fabled">Faction: Fabled</option>
      <option value="Pirate">Faction: Pirate</option>
    </select>
  </div>
</div>

<div id="loading" class="loading">Loading canonical hero roster…</div>
<div id="error" class="error" style="display:none"></div>
<div id="grid" class="grid" style="display:none"></div>
<div id="no-results" class="no-results" style="display:none">No heroes match the selected filters</div>

<div id="modal" class="modal-overlay hidden" onclick="closeModal()">
  <button class="modal-nav prev" onclick="event.stopPropagation(); navHero(-1)">&lsaquo;</button>
  <button class="modal-nav next" onclick="event.stopPropagation(); navHero(1)">&rsaquo;</button>
  <div id="modal-inner" onclick="event.stopPropagation()"></div>
</div>

<script>
/** Canonical SSOT: heroes-canonical.json from shared/definitions/heroCodex.ts + lore.ts HERO_ROSTER */
/** Absolute base so portraits work whether opened as /hero-codex or /hero-codex/index.html */
const ASSET_BASE = '/hero-codex/';
const CODEX_URL = ASSET_BASE + 'heroes-canonical.json';
/**
 * HD portraits SSOT (same files as local mirror):
 *   https://grudge-heros.puter.site/hero-portraits/{race}_{class}.png
 * Prefer Puter CDN first so production always shows the correct hero art;
 * fall back to local /hero-codex/hero-portraits/ then unit sprites.
 */
const PUTER_PORTRAIT_BASE = 'https://grudge-heros.puter.site/hero-portraits/';
const PUTER_SPRITE_BASE = 'https://grudge-heros.puter.site/';

const SKILL_SPRITE_MAP = {
  shield: 'sprites/effects/Icon_07.png',
  zap: 'sprites/effects/Icon_02.png',
  heart: 'sprites/effects/Icon_05.png',
  flame: 'sprites/effects/Icon_01.png',
  crosshair: 'sprites/effects/Icon_09.png',
  target: 'sprites/effects/Icon_04.png',
  split: 'sprites/effects/Icon_03.png',
  'cloud-rain': 'sprites/effects/Icon_03.png',
  crown: 'sprites/effects/Icon_06.png',
  'shield-check': 'sprites/effects/Icon_08.png',
  star: 'sprites/effects/Icon_06.png',
  skull: 'sprites/effects/Icon_09.png',
  sparkles: 'sprites/effects/Icon_10.png',
  megaphone: 'sprites/effects/Icon_06.png',
  swords: 'sprites/effects/Icon_04.png',
  paw: 'sprites/effects/Icon_01.png',
  bow: 'sprites/effects/Icon_03.png',
};

function skillSrc(icon) {
  return skillSrcAbs(icon);
}

const FACTION_COLORS = {
  Crusade: { bg: '#0c1a3a', border: '#3b82f6', glow: 'rgba(59,130,246,0.3)', gradient: 'linear-gradient(135deg, #0c1a3a 0%, #1a2d5a 50%, #0c1a3a 100%)' },
  Fabled: { bg: '#0c1e14', border: '#16a34a', glow: 'rgba(22,163,74,0.3)', gradient: 'linear-gradient(135deg, #0c1e14 0%, #14332a 50%, #0c1e14 100%)' },
  Legion: { bg: '#2a0c0c', border: '#ef4444', glow: 'rgba(239,68,68,0.3)', gradient: 'linear-gradient(135deg, #2a0c0c 0%, #3a1a1a 50%, #2a0c0c 100%)' },
  Pirate: { bg: '#1a1505', border: '#c9a030', glow: 'rgba(201,160,48,0.4)', gradient: 'linear-gradient(135deg, #1a1505 0%, #2a2010 50%, #1a1505 100%)' },
  Pirates: { bg: '#1a1505', border: '#c9a030', glow: 'rgba(201,160,48,0.4)', gradient: 'linear-gradient(135deg, #1a1505 0%, #2a2010 50%, #1a1505 100%)' },
};

const RARITY_CONFIG = {
  Common: { color: '#9ca3af', stars: 1 },
  Uncommon: { color: '#22c55e', stars: 2 },
  Rare: { color: '#3b82f6', stars: 3 },
  Epic: { color: '#a855f7', stars: 4 },
  Legendary: { color: '#f59e0b', stars: 5 },
};

const DIALOGUE_LABELS = {
  greeting_neutral: 'Greeting (neutral)',
  greeting_friendly: 'Greeting (friendly)',
  greeting_hostile: 'Greeting (hostile)',
  quest_offer: 'Quest offer',
  combat_start: 'Combat start',
  victory: 'Victory',
  defeat: 'Defeat',
};

let HEROES = [];
let filteredHeroes = [];
let selectedIndex = -1;
let currentTab = 'lore';

function starsHTML(rarity, size) {
  size = size || 12;
  const cfg = RARITY_CONFIG[rarity] || RARITY_CONFIG.Common;
  let html = '';
  for (let i = 0; i < cfg.stars; i++) {
    html += `<span class="star-icon" style="width:${size}px;height:${size}px;background:${cfg.color};filter:drop-shadow(0 0 2px ${cfg.color}60)"></span>`;
  }
  return html;
}

function statSVG(type, color) {
  const icons = {
    health: '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>',
    attack: '<path d="M6.92 5H5l7 7-3.5 3.5 1.42 1.42L13.5 13.5l3 3L19 14l-7-7z"/>',
    defense: '<path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/>',
    speed: '<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/>',
  };
  return `<svg class="svg-icon" width="11" height="11" viewBox="0 0 24 24" fill="${color}">${icons[type] || icons.attack}</svg>`;
}

function absUrl(path) {
  if (!path) return ASSET_BASE + 'hero-portraits/human_warrior.png';
  if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('/')) return path;
  return ASSET_BASE + path.replace(/^\.\//, '');
}

/** Puter HD portrait URL from portraitKey (human_mage, pirate_king, …) */
function puterPortraitUrl(key) {
  if (!key) return null;
  return PUTER_PORTRAIT_BASE + key + '.png';
}

/**
 * Extract race_class key from paths like:
 *   /hero-codex/hero-portraits/human_mage.png
 *   hero-portraits/orc_worg.png
 */
function portraitKeyFromPath(path) {
  if (!path) return null;
  const m = String(path).match(/hero-portraits\/([a-z0-9_]+)\.png/i);
  return m ? m[1] : null;
}

/** Puter only hosts race_class pack keys (+ pirate_king). Named heroes stay local. */
function isPuterPackKey(key) {
  if (!key) return false;
  if (key === 'pirate_king' || key === 'sky_captain') return true;
  return /^(human|orc|elf|dwarf|undead|barbarian)_(warrior|mage|ranger|worg)$/.test(key);
}

function portraitSrc(hero) {
  // Always prefer SSOT local portrait path — each hero has a unique file (no duplicates).
  // Puter CDN is fallback only when local 404s (see onerror chain).
  if (hero.portrait) return absUrl(hero.portrait);
  const key = hero.portraitKey || portraitKeyFromPath(hero.portrait) || null;
  if (key) return absUrl('hero-portraits/' + key + '.png');
  return absUrl('hero-portraits/human_warrior.png');
}

function portraitFallback(hero) {
  // onerror chain: local portrait → puter again by key → sprite (puter then local) → human warrior
  const key = hero.portraitKey || portraitKeyFromPath(hero.portrait);
  if (hero.portrait) return absUrl(hero.portrait);
  if (key) return absUrl('hero-portraits/' + key + '.png');
  if (hero.sprite) {
    // Prefer Puter unit sprites when relative
    const sp = hero.sprite.replace(/^\//, '').replace(/^hero-codex\//, '');
    if (sp.startsWith('sprites/')) return PUTER_SPRITE_BASE + sp;
    return absUrl(hero.sprite);
  }
  return absUrl('hero-portraits/human_warrior.png');
}

function portraitFallback2(hero) {
  if (hero.sprite) return absUrl(hero.sprite);
  return absUrl('hero-portraits/human_warrior.png');
}

function skillSrcAbs(icon) {
  const rel = SKILL_SPRITE_MAP[icon] || 'sprites/effects/Icon_06.png';
  return absUrl(rel);
}

function applyFilters() {
  const race = document.getElementById('filter-race').value;
  const cls = document.getElementById('filter-class').value;
  const faction = document.getElementById('filter-faction').value;
  filteredHeroes = HEROES.filter(h => {
    if (race !== 'All' && h.race !== race) return false;
    if (cls !== 'All' && h.className !== cls) return false;
    if (faction !== 'All' && h.faction !== faction) return false;
    return true;
  });
  document.getElementById('count').textContent = filteredHeroes.length;
  document.getElementById('total').textContent = HEROES.length;
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const noResults = document.getElementById('no-results');
  grid.style.display = 'flex';
  if (filteredHeroes.length === 0) {
    grid.innerHTML = '';
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';
  grid.innerHTML = filteredHeroes.map((hero, i) => {
    const fc = FACTION_COLORS[hero.faction] || FACTION_COLORS.Crusade;
    const borderColor = hero.factionColor || fc.border;
    const gradient = fc.gradient;
    const glow = fc.glow;
    const abilities = hero.abilities || [];
    return `<div class="card" style="border:2px solid ${borderColor};box-shadow:0 0 20px ${glow},0 4px 20px rgba(0,0,0,0.5);background:${gradient}" onclick="openModal(${i})">
      <div class="top-line" style="background:linear-gradient(90deg,transparent,${borderColor},transparent)"></div>
      <div class="card-portrait">
        <img src="${portraitSrc(hero)}" alt="${hero.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=function(){this.onerror=null;this.src='${portraitFallback2(hero)}'};this.src='${portraitFallback(hero)}'" />
        <div class="overlay"></div>
        <div class="card-sector-tag" title="${hero.sectorName || ''}">${hero.sectorName || hero.sectorSpawn || ''}</div>
        <div class="card-faction-tag" style="color:${borderColor};border:1px solid ${borderColor}40">${hero.faction}</div>
        <div class="card-name-area">
          <div class="card-name">
            <span class="card-name-first">${hero.firstName || hero.name.split(/\s+/)[0]}</span>
            ${hero.lastName || hero.name.split(/\s+/).slice(1).join(' ')
              ? `<span class="card-name-last">${hero.lastName || hero.name.split(/\s+/).slice(1).join(' ')}</span>`
              : ''}
          </div>
          <div class="card-title" style="color:${borderColor}">${hero.title}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="stars">${starsHTML(hero.rarity)}</div>
        ${hero.loadoutShort ? `<div class="card-loadout" style="color:${borderColor}">${hero.loadoutShort}</div>` : ''}
        <div class="stat-bar">
          <div class="stat">${statSVG('health','#22c55e')}<span style="color:#22c55e">${hero.stats.health}</span></div>
          <div class="stat">${statSVG('attack','#ef4444')}<span style="color:#ef4444">${hero.stats.attack}</span></div>
          <div class="stat">${statSVG('defense','#3b82f6')}<span style="color:#3b82f6">${hero.stats.defense}</span></div>
          <div class="stat">${statSVG('speed','#f59e0b')}<span style="color:#f59e0b">${hero.stats.speed}</span></div>
        </div>
        <div class="card-footer">
          <span class="card-meta">${hero.race} ${hero.className} · Lv ${hero.level}</span>
          <div class="card-abilities">
            ${abilities.slice(0,4).map(a => {
              const c = a.manaCost > 0 ? '#a78bfa' : '#4ade80';
              return `<div class="ability-icon-box" style="background:${borderColor}12;border:1px solid ${borderColor}25" title="${a.name}: ${a.description}"><img src="${skillSrcAbs(a.icon)}" style="filter:drop-shadow(0 0 2px ${c})" /></div>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="bottom-line" style="background:linear-gradient(90deg,transparent,${borderColor},transparent)"></div>
    </div>`;
  }).join('');
}

function openModal(idx) {
  selectedIndex = idx;
  currentTab = 'lore';
  renderModal();
  document.getElementById('modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.body.style.overflow = '';
  selectedIndex = -1;
}

function navHero(dir) {
  if (selectedIndex < 0) return;
  selectedIndex = (selectedIndex + dir + filteredHeroes.length) % filteredHeroes.length;
  currentTab = 'lore';
  renderModal();
}

function setTab(t) {
  currentTab = t;
  renderModal();
}

function renderModal() {
  const hero = filteredHeroes[selectedIndex];
  if (!hero) return;
  const fc = FACTION_COLORS[hero.faction] || FACTION_COLORS.Crusade;
  const borderColor = hero.factionColor || fc.border;
  const gradient = fc.gradient;
  const glow = fc.glow;
  const rarityCfg = RARITY_CONFIG[hero.rarity] || RARITY_CONFIG.Common;
  const tabs = ['lore', 'stats', 'skills', 'dialogue', 'quests'];

  let contentHTML = '';
  if (currentTab === 'lore') {
    contentHTML = `
      <div class="panel"><p style="font-size:12px;font-style:italic;color:${borderColor};line-height:1.6">${hero.quote || ''}</p></div>
      <div><div class="panel-label">Lore</div><p style="font-size:12px;color:#ccc;line-height:1.6">${hero.lore || ''}</p></div>
      <div><div class="panel-label">Backstory</div><p style="font-size:12px;color:#aaa;line-height:1.6">${hero.backstory || ''}</p></div>
      <div class="panel">
        <div class="panel-label">World placement</div>
        <div class="combat-row"><span class="label">Sector</span><span class="value">${hero.sectorName || hero.sectorSpawn || '—'} (${hero.sectorSpawn || ''})</span></div>
        <div class="combat-row"><span class="label">Quest giver</span><span class="value">${hero.isQuestGiver ? 'Yes' : 'No'}</span></div>
        <div class="combat-row"><span class="label">Canonical id</span><span class="value" style="font-family:monospace;font-size:11px">${hero.id}</span></div>
      </div>
      <div class="panel">
        <div class="panel-label">Racial Traits</div>
        ${(hero.racialTraits || []).map(t => `<div class="trait-row"><span class="trait-name">${t.name}</span><span class="trait-effect" style="color:${borderColor}">${t.effect}</span></div>`).join('')}
      </div>
      ${(hero.relationships && hero.relationships.length) ? `
      <div class="panel">
        <div class="panel-label">Relationships</div>
        ${hero.relationships.map(r => `<div class="rel-row"><span class="rel-type" style="color:${borderColor}">${r.type}</span><span><strong>${r.targetId}</strong> — ${r.description}</span></div>`).join('')}
      </div>` : ''}
      <div style="font-size:10px;font-style:italic;text-align:center;padding-top:8px;color:#666">${hero.flavorText || ''}</div>
    `;
  } else if (currentTab === 'stats') {
    const s = hero.stats || {};
    const statList = [
      { label: 'Health', value: s.health, type: 'health', color: '#22c55e' },
      { label: 'Attack', value: s.attack, type: 'attack', color: '#ef4444' },
      { label: 'Defense', value: s.defense, type: 'defense', color: '#3b82f6' },
      { label: 'Speed', value: s.speed, type: 'speed', color: '#f59e0b' },
      { label: 'Range', value: s.range, type: 'attack', color: '#06b6d4' },
      { label: 'Mana', value: s.mana, type: 'speed', color: '#8b5cf6' },
    ];
    contentHTML = `
      <div class="stat-grid">
        ${statList.map(st => `<div class="stat-box">${statSVG(st.type, st.color)}<span class="stat-val" style="color:${st.color}">${st.value ?? '—'}</span><span class="stat-label">${st.label}</span></div>`).join('')}
      </div>
      <div>
        <div class="panel-label">Combat Profile</div>
        <div class="combat-row"><span class="label">Combat Style</span><span class="value">${hero.combatStyle || '—'}</span></div>
        <div class="combat-row"><span class="label">Weapons</span><span class="value" style="max-width:200px">${hero.weapons || '—'}</span></div>
        <div class="combat-row"><span class="label">Difficulty</span><span style="color:${hero.difficulty==='Expert'?'#ef4444':hero.difficulty==='Advanced'?'#f59e0b':hero.difficulty==='Intermediate'?'#3b82f6':'#22c55e'}">${hero.difficulty || '—'}</span></div>
        <div class="combat-row"><span class="label">Primary Attr</span><span style="color:${borderColor};font-weight:700">${hero.primaryAttribute || '—'}</span></div>
        <div class="combat-row"><span class="label">Level</span><span class="value">${hero.level ?? '—'}</span></div>
        <div class="combat-row"><span class="label">Rarity</span><span>${starsHTML(hero.rarity, 14)}</span></div>
      </div>
      <div class="sw-grid">
        <div>
          <div class="panel-label" style="color:#22c55e">Strengths</div>
          <ul class="sw-list">${(hero.strengths || []).map(x => `<li><span style="color:#22c55e">+</span> ${x}</li>`).join('')}</ul>
        </div>
        <div>
          <div class="panel-label" style="color:#ef4444">Weaknesses</div>
          <ul class="sw-list">${(hero.weaknesses || []).map(w => `<li><span style="color:#ef4444">-</span> ${w}</li>`).join('')}</ul>
        </div>
      </div>
    `;
  } else if (currentTab === 'skills') {
    contentHTML = `
      <div style="display:flex;flex-direction:column;gap:8px">
        ${(hero.abilities || []).map(a => {
          const costHTML = a.manaCost > 0
            ? `<span class="ability-cost" style="background:rgba(139,92,246,0.15);color:#a78bfa">${a.manaCost} MP</span>`
            : `<span class="ability-cost" style="background:rgba(34,197,94,0.15);color:#4ade80">Passive</span>`;
          return `<div class="ability-row">
            <div class="ability-icon-lg" style="background:${borderColor}20;border:1px solid ${borderColor}40">
              <img src="${skillSrc(a.icon)}" style="filter:drop-shadow(0 0 2px ${borderColor})" />
            </div>
            <div class="ability-info">
              <div class="ability-header"><span class="ability-name">${a.name}</span>${costHTML}</div>
              <div class="ability-desc">${a.description}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="panel">
        <div class="panel-label">Racial Traits</div>
        ${(hero.racialTraits || []).map(t => `<div class="trait-row"><span class="trait-name" style="font-size:12px">${t.name}</span><span class="trait-effect" style="color:${borderColor}">${t.effect}</span></div>`).join('')}
      </div>
    `;
  } else if (currentTab === 'dialogue') {
    const d = hero.dialogue || {};
    const keys = Object.keys(DIALOGUE_LABELS);
    contentHTML = `
      <div class="panel-label">2D / NPC dialogue pack (canonical)</div>
      ${keys.map(k => {
        const text = d[k];
        if (text === undefined || text === null || text === '') {
          return `<div class="dialogue-line"><div class="dialogue-key">${DIALOGUE_LABELS[k]}</div><div class="dialogue-text" style="color:#666;font-style:normal">(silent / no line)</div></div>`;
        }
        return `<div class="dialogue-line"><div class="dialogue-key">${DIALOGUE_LABELS[k]}</div><div class="dialogue-text">"${text}"</div></div>`;
      }).join('')}
    `;
  } else if (currentTab === 'quests') {
    const quests = hero.questPool || [];
    contentHTML = quests.length
      ? quests.map(q => `<div class="quest-row"><div class="quest-title">${q.title}</div><div class="quest-desc">${q.description}</div><div style="font-size:9px;color:#666;margin-top:4px;font-family:monospace">${q.id}</div></div>`).join('')
      : `<div class="panel"><p style="font-size:12px;color:#888">No quest pool defined for this hero yet.</p></div>`;
  }

  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-card" style="border:2px solid ${borderColor};box-shadow:0 0 40px ${glow},0 8px 40px rgba(0,0,0,0.6);background:${gradient}">
      <div class="modal-portrait">
        <img src="${portraitSrc(hero)}" alt="${hero.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=function(){this.onerror=null;this.src='${portraitFallback2(hero)}'};this.src='${portraitFallback(hero)}'" />
        <div class="gradient-bottom"></div>
        <div class="gradient-right"></div>
        <div class="modal-tags">
          <div class="modal-tag" style="border:1px solid ${rarityCfg.color}40"><span style="display:flex;gap:3px">${starsHTML(hero.rarity, 13)}</span></div>
          <span class="modal-tag" style="color:${borderColor};border:1px solid ${borderColor}50">${hero.faction}</span>
          <span class="modal-tag" style="color:#ccc;border:1px solid rgba(255,255,255,0.15)">${hero.sectorName || ''}</span>
        </div>
        <div class="modal-name-area">
          <div class="modal-name">${hero.name}</div>
          <div style="font-size:11px;color:#aaa;margin-top:2px">${hero.firstName || ''}${hero.lastName ? ' · ' + hero.lastName : ''}</div>
          <div class="modal-title-text" style="color:${borderColor}">${hero.title}</div>
          <div class="modal-race-info">
            <span style="color:#ccc">${hero.race}</span>
            <span style="color:#888">/</span>
            <span style="color:#ccc">${hero.className}</span>
            <span style="color:#888">/</span>
            <span style="color:${borderColor};font-weight:700">${hero.alignment || ''}</span>
          </div>
        </div>
      </div>
      <div class="modal-right">
        <div class="modal-tabs">
          ${tabs.map(t => `<button class="modal-tab ${currentTab===t?'active':''}" style="color:${currentTab===t?borderColor:'#888'};border-bottom-color:${currentTab===t?borderColor:'transparent'}" onclick="setTab('${t}')">${t}</button>`).join('')}
        </div>
        <div class="modal-content">${contentHTML}</div>
      </div>
    </div>
  `;
}

document.addEventListener('keydown', e => {
  if (selectedIndex < 0) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') navHero(-1);
  if (e.key === 'ArrowRight') navHero(1);
});

fetch(CODEX_URL)
  .then(r => {
    if (!r.ok) throw new Error('Failed to load ' + CODEX_URL + ' (' + r.status + ')');
    return r.json();
  })
  .then(data => {
    const raw = data.heroes || [];
    // Enforce unique portrait URLs on the page (first hero wins if data ever collides)
    const seenPortrait = new Set();
    HEROES = raw.map((h) => {
      let src = h.portrait || '';
      if (seenPortrait.has(src) && h.portraitKey) {
        src = ASSET_BASE + 'hero-portraits/' + h.portraitKey + '.png';
      }
      if (seenPortrait.has(src)) {
        console.warn('[Hero Codex] duplicate portrait for', h.id, src);
      }
      seenPortrait.add(src);
      const parts = (h.name || '').trim().split(/\s+/);
      return {
        ...h,
        portrait: src,
        firstName: h.firstName || parts[0] || h.name,
        lastName: h.lastName || parts.slice(1).join(' ') || '',
      };
    });
    document.getElementById('loading').style.display = 'none';
    applyFilters();
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    el.style.display = 'block';
    el.textContent = 'Could not load canonical hero roster: ' + err.message;
  });
</script>
</body>
</html>
