<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GRUDGE — Class Skill Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script>
  window.GRUDGE_CONFIG = window.GRUDGE_CONFIG || {
    AUTH_GATEWAY: 'https://id.grudge-studio.com',
    GAME_DATA: 'https://grudge-api-production-0d46.up.railway.app',
    CRAFTING_URL: 'https://grudge-crafting.puter.site',
  };
</script>
<script src="./grudge-fleet.js"></script>
<style>
/* ---------- base ---------- */
:root{
  --ink:#eef2ff;
  --mute:#9aa3c7;
  --line:rgba(255,255,255,.08);
  --gold:#f6c945;
  --gold2:#ffd98a;
  --shadow:0 20px 60px -20px rgba(0,0,0,.55);
  --c-worg:#c792ff;
  --c-worge:#d97706;
  --c-warrior:#ff6b57;
  --c-mage:#6aa9ff;
  --c-ranger:#6bdc8b;
  /* ObjectStore classes.json colors */
  --c-priest:#fde68a;
  --c-raider:#b91c1c;
  --c-thief:#ca8a04;
  --c-verduror:#86efac;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--ink);
  overflow-x:hidden;background:#05060c;
}

/* ---------- animated hero background ---------- */
.stage{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  transition:filter .6s ease;
}
.stage .bg{
  position:absolute;inset:-4%;
  background-size:cover;background-position:center;
  filter:saturate(1.1) brightness(.55);
  transform:scale(1.06);
  transition:opacity 1.2s ease, transform 8s ease;
  opacity:0;
}
.stage .bg.active{opacity:1;transform:scale(1.02)}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 50% 110%,rgba(0,0,0,.75),transparent 55%),
    radial-gradient(900px 500px at 10% -10%,rgba(10,15,40,.6),transparent 60%),
    linear-gradient(180deg,rgba(5,6,12,.4),rgba(5,6,12,.82));
}
/* animated stars / particles */
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen;opacity:.8}
.particles span{
  position:absolute;display:block;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:0;
  animation:drift linear infinite;
}
@keyframes drift{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  10%{opacity:.9}
  100%{opacity:0;transform:translateY(-110vh) scale(1.3)}
}
/* moving gradient sheen */
.sheen{
  position:absolute;inset:-20%;pointer-events:none;
  background:
    conic-gradient(from 0deg at 30% 40%,rgba(106,169,255,.12),transparent 25%,rgba(199,146,255,.10) 55%,transparent 80%,rgba(107,220,139,.09));
  filter:blur(60px);
  animation:spin 40s linear infinite;
  opacity:.9;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
.shell{position:relative;z-index:2;max-width:1440px;margin:0 auto;padding:26px 26px 60px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.brand{
  font-family:'Cinzel',serif;font-weight:900;letter-spacing:3px;font-size:22px;
  background:linear-gradient(90deg,var(--gold),#fff3c2 50%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(246,201,69,.15);
}
.brand small{
  display:block;font-family:'Inter',sans-serif;letter-spacing:2px;
  color:var(--mute);font-weight:600;font-size:10px;margin-top:2px;
}
.crumbs{margin-left:auto;color:var(--mute);font-size:12px;letter-spacing:2px}
.crumbs b{color:#fff}

/* race / class picker strips */
.racepicker{
  display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px;
}
@media (max-width:820px){.racepicker{grid-template-columns:repeat(3,1fr)}}
.race{
  position:relative;cursor:pointer;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;aspect-ratio:1/1;
  background:#0b0f1e;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.race:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.race .portrait{
  position:absolute;inset:0;background-size:cover;background-position:center top;
  transform:scale(1.03);transition:transform .5s ease,filter .3s ease;
  filter:saturate(.9) brightness(.9);
}
.race:hover .portrait{transform:scale(1.1);filter:saturate(1.1) brightness(1)}
.race::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(6,8,16,.8));
}
.race .label{
  position:absolute;left:0;right:0;bottom:6px;z-index:2;text-align:center;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.9);
}
.race.active{
  border-color:transparent;
  box-shadow:0 0 0 1px rgba(246,201,69,.6),0 14px 40px -14px rgba(246,201,69,.5);
}
.race.active .portrait{filter:saturate(1.2) brightness(1.05);transform:scale(1.08)}
.race.active::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 60% at 50% 120%,rgba(246,201,69,.3),transparent 60%);
}

/* class picker strip */
.classpicker{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;
}
@media (max-width:820px){.classpicker{grid-template-columns:repeat(2,1fr)}}
.cls{
  position:relative;cursor:pointer;
  border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 16px;
  background:linear-gradient(180deg,rgba(18,22,40,.75),rgba(10,12,22,.75));
  backdrop-filter:blur(14px);
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  overflow:hidden;
}
.cls:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18)}
.cls .cover{
  position:absolute;inset:0;z-index:0;opacity:.55;
  background-size:cover;background-position:center top;
  mask-image:linear-gradient(180deg,black,transparent 85%);
  transform:scale(1.05);transition:transform .6s ease,opacity .3s ease;
  filter:saturate(.9) brightness(.8);
}
.cls:hover .cover{transform:scale(1.12);opacity:.7;filter:saturate(1.1) brightness(.9)}
.cls .head{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.cls .crest{
  width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 0 30px rgba(255,255,255,.05);
}
.cls h3{margin:0;font-family:'Cinzel',serif;font-size:18px;letter-spacing:1px}
.cls .role{position:relative;z-index:1;color:var(--mute);font-size:12px;margin-top:2px;letter-spacing:.5px}
.cls p{position:relative;z-index:1;color:#cfd5f5;font-size:13px;line-height:1.45;margin:12px 0 0}
.cls.active{
  border-color:transparent;
  box-shadow:0 0 0 1px rgba(246,201,69,.55),0 22px 50px -20px rgba(246,201,69,.35);
}
.cls.active .cover{opacity:.85;filter:saturate(1.1) brightness(.95)}
.cls[data-k="mage"]    .crest{background:linear-gradient(180deg,#bcd8ff,#6aa9ff);color:#04122c}
.cls[data-k="warrior"] .crest{background:linear-gradient(180deg,#ffb3a6,#ff6b57);color:#2a0a07}
.cls[data-k="ranger"]  .crest{background:linear-gradient(180deg,#b2f0c4,#6bdc8b);color:#06220f}
.cls[data-k="worg"]   .crest{background:linear-gradient(180deg,#e1c8ff,#c792ff);color:#1c0a3a}
.cls[data-k="worge"]  .crest{background:linear-gradient(180deg,#fbbf24,#d97706);color:#1c0a00}
.cls[data-k="priest"] .crest{background:linear-gradient(180deg,#fff3c2,#fde68a);color:#3a2e08}
.cls[data-k="raider"] .crest{background:linear-gradient(180deg,#f5a3a3,#b91c1c);color:#2a0707}
.cls[data-k="thief"]  .crest{background:linear-gradient(180deg,#f5de8a,#ca8a04);color:#2a2204}
.cls[data-k="verduror"] .crest{background:linear-gradient(180deg,#c8f7d6,#86efac);color:#0a2a14}
.cls .crest img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}

/* ---------- main grid ---------- */
.main{display:grid;grid-template-columns:1fr 380px;gap:20px}
@media (max-width:1100px){.main{grid-template-columns:1fr}}

.board{
  position:relative;
  border:1px solid var(--line);border-radius:22px;
  background:
    radial-gradient(600px 300px at 10% -10%,rgba(255,255,255,.06),transparent 60%),
    linear-gradient(180deg,rgba(16,20,36,.78),rgba(8,10,20,.78));
  backdrop-filter:blur(12px);
  padding:22px 22px 26px;overflow:hidden;
  box-shadow:var(--shadow);
}
.board::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center,black 65%,transparent 100%);
}
.board::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:
    radial-gradient(800px 320px at 75% 0%,rgba(255,255,255,.08),transparent 60%),
    url('https://i.imgur.com/0SOCXgv.png') center/cover no-repeat;
  mix-blend-mode:screen;
}
.board-head{display:flex;align-items:center;gap:14px;margin:2px 0 10px}
.board-head h2{margin:0;font-family:'Cinzel',serif;letter-spacing:2px;font-size:22px}
.board-head .tag{
  margin-left:auto;font-size:11px;color:var(--mute);letter-spacing:2px;
  padding:6px 10px;border:1px solid var(--line);border-radius:999px;
}
.progress{
  position:relative;height:10px;border-radius:999px;margin:10px 0 20px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden;
}
.progress .fill{
  position:absolute;inset:0;width:0%;
  background:linear-gradient(90deg,var(--gold),#fff3c2,var(--gold));
  box-shadow:0 0 30px rgba(246,201,69,.5) inset;
  transition:width .45s cubic-bezier(.2,.8,.2,1);
}
.progress .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 4px;align-items:center}
.progress .ticks span{font-size:9px;color:var(--mute);letter-spacing:2px}

/* tree */
.tree{position:relative;display:flex;flex-direction:column;gap:28px;z-index:1}
.tier{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.tier-label{
  text-align:right;color:var(--mute);font-size:11px;letter-spacing:2px;text-transform:uppercase;
  border-right:1px dashed rgba(255,255,255,.12);padding-right:14px;
}
.tier-label b{display:block;font-family:'Cinzel',serif;font-size:22px;color:#fff;letter-spacing:0;margin-bottom:2px}
.tier-label .pickhint{
  display:inline-block;margin-top:6px;font-size:10px;padding:3px 8px;
  border-radius:999px;background:rgba(255,255,255,.05);color:#cfd5f5;border:1px solid var(--line);
}
.tier.auto .pickhint{background:linear-gradient(180deg,rgba(246,201,69,.2),rgba(246,201,69,.05));color:var(--gold2);border-color:rgba(246,201,69,.35)}

.row{display:flex;flex-wrap:wrap;gap:14px}
.node{
  position:relative;width:220px;min-height:112px;cursor:pointer;
  border-radius:16px;padding:14px 14px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--line);
  transition:transform .18s ease,border-color .18s ease,box-shadow .25s ease;
  overflow:hidden;
}
.node::before{
  content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:radial-gradient(240px 100px at var(--mx,30%) var(--my,20%),rgba(255,255,255,.08),transparent 60%);
  opacity:0;transition:opacity .2s;
}
.node:hover::before{opacity:1}
.node:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.node .head{display:flex;align-items:center;gap:10px}
.node .icon{
  width:42px;height:42px;border-radius:10px;display:grid;place-items:center;overflow:hidden;
  font-size:18px;font-weight:900;color:#06101f;
  background:linear-gradient(180deg,#fff,#cfd8ff);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 6px 22px -12px rgba(255,255,255,.4);
}
.node .icon img{width:100%;height:100%;display:block;object-fit:cover}
.node .name{font-weight:800;font-size:14px;letter-spacing:.2px}
.node .desc{color:#c9cfec;font-size:12px;line-height:1.45;margin-top:6px;min-height:34px}
.node .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.node .meta span{
  font-size:10px;color:#dcdff0;background:rgba(255,255,255,.06);
  padding:2px 7px;border-radius:999px;letter-spacing:.3px;
}
.node.auto{
  border-color:rgba(246,201,69,.4);
  background:linear-gradient(180deg,rgba(246,201,69,.14),rgba(246,201,69,.02));
  box-shadow:0 10px 40px -18px rgba(246,201,69,.5);
}
.node.auto .badge{
  position:absolute;top:10px;right:10px;font-size:9px;letter-spacing:1.5px;
  background:linear-gradient(180deg,var(--gold),#d8a819);color:#201608;
  padding:3px 8px;border-radius:999px;font-weight:800;
}
.node.locked{opacity:.55;filter:saturate(.6)}
.node.selected{
  border-color:transparent;
  animation:pick .6s ease;
  box-shadow:0 0 0 1px rgba(246,201,69,.6),0 10px 50px -10px rgba(246,201,69,.55),0 0 40px rgba(246,201,69,.15);
  background:linear-gradient(180deg,rgba(246,201,69,.18),rgba(246,201,69,.04));
}
.node.selected .icon{box-shadow:0 0 18px rgba(246,201,69,.9),inset 0 0 0 1px rgba(0,0,0,.15)}
@keyframes pick{
  0%{transform:scale(1)}
  35%{transform:scale(1.06) rotate(.3deg)}
  100%{transform:scale(1)}
}
/* class themed icon colors */
.tree[data-k="mage"]    .node .icon{background:linear-gradient(180deg,#bcd8ff,#6aa9ff);color:#03132c}
.tree[data-k="warrior"] .node .icon{background:linear-gradient(180deg,#ffb3a6,#ff6b57);color:#2a0a07}
.tree[data-k="ranger"]  .node .icon{background:linear-gradient(180deg,#b2f0c4,#6bdc8b);color:#08220f}
.tree[data-k="worg"]   .node .icon{background:linear-gradient(180deg,#e1c8ff,#c792ff);color:#1c0a3a}
.tree[data-k="worge"]  .node .icon{background:linear-gradient(180deg,#fbbf24,#d97706);color:#1c0a00}
.tree[data-k="priest"]  .node .icon{background:linear-gradient(180deg,#fff3c2,#fde68a);color:#3a2e08}
.tree[data-k="raider"]  .node .icon{background:linear-gradient(180deg,#f5a3a3,#b91c1c);color:#2a0707}
.tree[data-k="thief"]   .node .icon{background:linear-gradient(180deg,#f5de8a,#ca8a04);color:#2a2204}
.tree[data-k="verduror"] .node .icon{background:linear-gradient(180deg,#c8f7d6,#86efac);color:#0a2a14}

/* ---------- side panel ---------- */
.side{
  position:sticky;top:20px;align-self:start;
  border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(180deg,rgba(16,20,36,.85),rgba(8,10,20,.85));
  backdrop-filter:blur(14px);
  padding:18px;min-height:520px;
  box-shadow:var(--shadow);overflow:hidden;
}
.side::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:
    radial-gradient(600px 200px at 50% 0%,rgba(255,255,255,.08),transparent 60%),
    url('https://i.imgur.com/0SOCXgv.png') center/cover no-repeat;
  mix-blend-mode:screen;
}
.side > *{position:relative;z-index:1}
.side .hero{
  position:relative;height:220px;border-radius:16px;overflow:hidden;margin-bottom:16px;
  background:#0a0f20;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 18px 40px -24px rgba(0,0,0,.65);
}
.side .hero .img{
  position:absolute;inset:0;background-size:cover;background-position:center;
  transform:scale(1.05);transition:transform .8s ease;
}
.side .hero:hover .img{transform:scale(1.12)}
.side .hero::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(6,8,16,.08),rgba(6,8,16,.82)),
    radial-gradient(400px 180px at 50% 0%,rgba(255,255,255,.12),transparent 60%);
}
.side .hero .title{
  position:absolute;left:14px;right:14px;bottom:10px;z-index:2;
}
.side .hero .title h3{margin:0;font-family:'Cinzel',serif;font-size:22px;letter-spacing:1.5px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.side .hero .title span{color:#dcdff0;font-size:11px;letter-spacing:1.5px}

.build{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.bline{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);
  font-size:12px;
}
.bline.picked{border-color:rgba(246,201,69,.35);background:linear-gradient(180deg,rgba(246,201,69,.07),transparent)}
.bline .dot{width:8px;height:8px;border-radius:50%;background:#555c7a}
.bline.picked .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.bline .lbl{font-family:'Cinzel',serif;letter-spacing:1.5px;color:var(--mute);width:60px}
.bline b{color:#fff}
.bline em{margin-left:auto;color:var(--mute);font-style:normal;font-size:11px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  appearance:none;border:0;cursor:pointer;font-weight:800;font-size:13px;
  padding:11px 14px;border-radius:12px;transition:transform .1s,filter .15s,box-shadow .2s;
  letter-spacing:.5px;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.primary{
  background:linear-gradient(180deg,var(--gold),#d8a819);color:#20180a;
  box-shadow:0 10px 30px -10px rgba(246,201,69,.65);
}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:rgba(255,70,70,.12);color:#ff9aa0;border:1px solid rgba(255,70,70,.3)}

/* tooltip */
.tip{
  position:fixed;z-index:100;pointer-events:none;
  background:rgba(10,12,22,.95);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;max-width:280px;font-size:12px;line-height:1.5;color:#dfe3f7;
  box-shadow:var(--shadow);
  opacity:0;transform:translateY(6px);transition:opacity .14s ease,transform .14s ease;
}
.tip.show{opacity:1;transform:translateY(0)}
.tip b{color:#fff}
.tip .thumb{
  width:48px;height:48px;border-radius:10px;overflow:hidden;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
}
.tip .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.tip .row{display:flex;gap:10px;margin-top:6px;color:var(--mute);font-size:11px}
.tip .row span{background:rgba(255,255,255,.05);padding:2px 6px;border-radius:6px}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,40px);
  background:linear-gradient(180deg,var(--gold),#d8a819);color:#20180a;
  padding:14px 20px;border-radius:14px;font-weight:800;letter-spacing:.8px;
  box-shadow:0 20px 60px -20px rgba(246,201,69,.6);
  opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* curtain transition when confirming */
.curtain{
  position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(246,201,69,.18),rgba(5,6,12,.95) 60%);
  opacity:0;pointer-events:none;z-index:150;transition:opacity .6s ease;
}
.curtain.show{opacity:1}

/* responsive tweaks */
@media (max-width:720px){
  .tier{grid-template-columns:1fr}
  .tier-label{text-align:left;border-right:0;border-left:2px solid rgba(255,255,255,.1);padding:0 0 0 10px}
  .node{width:calc(50% - 7px)}
}

    /* Reused from MolochDaGod/ObjectStore profession-trees.html
     * (preview dpl_FiBKimTbjuib46iW8FRu7KhLaiB9, also profession-trees.html on that repo):
     * tree container, SVG, branch legend, node tooltip. */
    .tree-graph-wrap{position:relative;width:100%;height:420px;min-height:320px;overflow:hidden;border:1px solid rgba(212,175,55,.25);border-radius:8px;background:rgba(10,14,20,.45);margin:0 0 18px}
    .tree-svg{position:absolute;inset:0;width:100%;height:100%}
    .branch-legend{position:absolute;top:12px;left:12px;background:rgba(10,14,20,.88);border:1px solid rgba(212,175,55,.35);border-radius:8px;padding:12px;z-index:10;max-width:220px}

<script>
/* -------- races -------- */
const RACES = {
  elf:       {name:"Elf",       img:"https://i.imgur.com/rWEKVAw.png", blurb:"Agile & arcane-touched. +DEX, +INT."},
  human:     {name:"Human",     img:"https://i.imgur.com/qBSRLZG.png", blurb:"Balanced and versatile. +ALL."},
  dwarf:     {name:"Dwarf",     img:"https://i.imgur.com/6A4px2O.png", blurb:"Stoic and resilient. +VIT, +STR."},
  orc:       {name:"Orc",       img:"https://i.imgur.com/4PyTEN5.png", blurb:"Savage power. +STR, +END."},
  barbarian: {name:"Barbarian", img:"https://i.imgur.com/7WKJ8Bw.png", blurb:"Relentless fury. +STR, +LCK."},
  undead:    {name:"Undead",    img:"https://i.imgur.com/mPTojTj.png", blurb:"Deathless and cursed. +WIS, +END."},
};
const PANEL_BG = "https://i.imgur.com/0SOCXgv.png";

/* -------- class tree: shared/definitions/classSkillTrees.ts -------- */
const CLASS_ART = {
  mage: "https://i.imgur.com/vKQR4UT.png",
  warrior: "https://i.imgur.com/Wj2mUH2.png",
  ranger: "https://i.imgur.com/5A6e5kL.png",
  worg: "https://i.imgur.com/BrQH0Bx.png",
  worge: "https://i.imgur.com/BrQH0Bx.png",
  // ObjectStore classes.json iconUrl — no large art in the SSOT for these four
  priest: "https://assets.grudge-studio.com/icons/warlords/classes/priest.jpg",
  raider: "https://assets.grudge-studio.com/icons/warlords/classes/raider.jpg",
  thief: "https://assets.grudge-studio.com/icons/warlords/classes/thief.jpg",
  verduror: "https://assets.grudge-studio.com/icons/warlords/classes/verduror.jpg",
};
const CLASS_EMOJI = { mage:"🔮", warrior:"🗡️", ranger:"🏹", worg:"🐺", worge:"🐺", priest:"✚", raider:"⚔", thief:"🗡", verduror:"🌿" };
const SSOT_INFO = window.GRUDGE_SSOT_CLASS_INFO || { classes:{}, dossier:{}, playOrder:[] };
const PLAY_ORDER = SSOT_INFO.playOrder || ["warrior","raider","mage","priest","ranger","thief","worge","verduror"];
const CLASS_DOSSIER = SSOT_INFO.dossier || {};
/* Icon host rewrite from ObjectStore weapon-skill-tree.js `defaultAsset` (lines 139–146).
 * info/objectstore return HTML (200) for /icons — never load those hosts. */
const ASSET_CDN = "https://assets.grudge-studio.com";
function defaultAsset(url){
  if (!url) return url;
  let u = String(url).trim();
  u = u.replace(/^https?:\/\/(www\.)?(info|objectstore)\.grudge-studio\.com/i, ASSET_CDN);
  if (/^(https?:|data:|blob:)/i.test(u)) return u;
  if (u.startsWith("/icons/") || u.startsWith("/game-assets/icons/")) return ASSET_CDN + u;
  return u;
}
function assetUrl(path){
  const u = defaultAsset(path);
  if (!u) return "";
  const s = String(u);
  if (s.startsWith("http://") || s.startsWith("https://")) return encodeURI(s);
  return "";
}
function dossierFor(id){
  const cid = canonicalClassId(id);
  if (CLASS_DOSSIER[cid]) return CLASS_DOSSIER[cid];
  // Legacy pack id worg → dossier for canonical worge
  if (cid === "worge" && CLASS_DOSSIER.worge) return CLASS_DOSSIER.worge;
  return null;
}
function skillStats(s){
  const stats = {};
  if (s.effectType) stats.Type = s.effectType;
  if (s.cooldown != null) stats.CD = s.cooldown + "s";
  if (s.manaCost) stats.Mana = s.manaCost;
  if (s.staminaCost) stats.Stamina = s.staminaCost;
  if (s.effect && s.effect !== "None") stats.Effect = s.effect;
  if (s.maxPoints != null) stats.MaxPts = s.maxPoints;
  return stats;
}
function mapSkill(s){
  let icon = "";
  // Profession-trees page uses iconUrl then icon; both fields are from the data file.
  const rawIcon = s.iconUrl || s.icon;
  if (rawIcon) {
    const raw = String(rawIcon);
    if (raw.startsWith("http://") || raw.startsWith("https://") || raw.startsWith("/")) {
      icon = assetUrl(raw);
    }
  }
  const req = s.requires || s.prerequisite || s.requirement || "";
  const stats = skillStats(s);
  if (req) stats.Requires = req;
  return {
    n: s.name || "",
    id: s.id || "",
    i: s.passive ? "" : (s.effectType === "ultimate" ? "✪" : "✶"),
    d: s.description || "",
    stats,
    icon,
    effect: s.effect || "",
    maxPoints: s.maxPoints,
    effectType: s.effectType || "",
    requires: req,
  };
}
function skillChoices(t){
  return t.choices || t.skills || [];
}
function buildClasses(classes){
  const out = {};
  for (const [id, tree] of Object.entries(classes || {})) {
    const dossier = dossierFor(id);
    const classIcon = assetUrl(tree.classIcon) || (dossier && dossier.iconUrl) || "";
    // 3.1.0 has no pickMode and no specialAbility L0 row. Do not invent one.
    // A missing description or role stays empty (priest has `role` in 3.1.0).
    out[id] = {
      name: tree.className || "",
      role: tree.role || tree.family || "",
      emoji: tree.emoji || CLASS_EMOJI[id] || (dossier && dossier.emoji) || "",
      desc: tree.description || tree.role || "",
      color: tree.color || ("var(--c-" + id + ")"),
      hero: CLASS_ART[id] || classIcon || "",
      classIcon,
      family: tree.family || "",
      source: tree.source || "Spawn 3.1.0 master-skillTrees.json",
      catalog: false,
      dossier,
      graph: tree.graph || null,
      specIdentity: tree.specIdentity || null,
      // Trees start at the file's first tier (requiredLevel 1). No L0 / Innate row.
      tiers: (tree.tiers || []).map((t) => {
        const choices = skillChoices(t);
        const lvl = (t.level != null) ? t.level : t.requiredLevel;
        return {
          lvl,
          label: t.tierName || t.name || "",
          hint: t.description || "",
          auto: false,
          // 3.1.0 has no per-tier pick cap; do not invent "pick 1".
          picks: (t.picks != null) ? t.picks : null,
          catalog: false,
          skills: choices.map(mapSkill),
        };
      }),
    };
  }
  return out;
}
// Page trees come from Spawn 3.1.0 (all 8 classes). The Grudge-Builder pack
// and ObjectStore 3.0.0 trees are not used here.
const MASTER = window.GRUDGE_MASTER_SKILL_TREES;
if (!MASTER || !MASTER.skillTrees) {
  throw new Error("Missing master-skillTrees-3.1.0.js");
}
const MERGED_TREES = Object.assign({}, MASTER.skillTrees);
const _built = buildClasses(MERGED_TREES);
const CLASSES = {};
PLAY_ORDER.forEach(id => { if (_built[id]) CLASSES[id] = _built[id]; });
Object.keys(_built).forEach(id => { if (!CLASSES[id]) CLASSES[id] = _built[id]; });

/* -------- state (scoped to active character Grudge UUID) -------- */
const KEY_PREFIX = "gw-selector-v3";
function activeCharId(){
  try {
    if (window.GrudgeFleet && typeof GrudgeFleet.getActiveId === "function") {
      const id = GrudgeFleet.getActiveId();
      if (id) return String(id);
    }
  } catch(_){}
  try {
    return localStorage.getItem("grudge_active_character")
      || localStorage.getItem("grudge.activeCharId")
      || "guest";
  } catch(_){ return "guest"; }
}
function storageKey(){ return KEY_PREFIX + ":" + activeCharId(); }
const state = load() || {race:null,cls:null,picks:{},characterId:null};
const editedClasses = new Set();
function markEdited(id){ if (id) editedClasses.add(id); }
function load(){
  try{
    // Prefer character-scoped key; migrate legacy global once
    const scoped = localStorage.getItem(storageKey());
    if (scoped) return remapLoadedState(JSON.parse(scoped));
    const legacy = localStorage.getItem(KEY_PREFIX);
    if (legacy) {
      const data = remapLoadedState(JSON.parse(legacy));
      data.characterId = activeCharId();
      localStorage.setItem(storageKey(), JSON.stringify(data));
      return data;
    }
  }catch(e){}
  return null;
}
function canonicalClassId(id){
  if (id == null || id === "") return id;
  const c = String(id).toLowerCase();
  if (c === "worg") return "worge";
  if (c === "rogue") return "thief";
  if (c === "mage priest") return "mage";
  return String(id);
}
function remapLoadedState(data){
  if (!data || typeof data !== "object") return data;
  if (data.cls) data.cls = canonicalClassId(data.cls);
  if (data.picks && typeof data.picks === "object" && data.picks.worg != null && data.picks.worge == null) {
    data.picks.worge = data.picks.worg;
  }
  return data;
}
function innateLevelsFor(classId){
  const cls = (typeof CLASSES !== "undefined" && CLASSES[classId]) || null;
  return new Set((cls && cls.tiers || []).filter(isInnateDisplay).map(t => String(t.lvl)));
}
function picksForPersist(classId){
  const src = (state.picks && state.picks[classId]) || {};
  const innate = innateLevelsFor(classId);
  const out = {};
  Object.entries(src).forEach(([lvl, v])=>{
    if (innate.has(String(lvl))) return;
    out[lvl] = v;
  });
  return out;
}
function save(opts){
  try{
    state.characterId = activeCharId();
    state.updatedAt = Date.now();
    if (opts && opts.reset) {
      editedClasses.clear();
      localStorage.setItem(storageKey(), JSON.stringify({
        race: null, cls: null, picks: {},
        characterId: state.characterId, updatedAt: state.updatedAt,
      }));
    } else {
      let prev = {};
      try { prev = JSON.parse(localStorage.getItem(storageKey()) || "{}") || {}; } catch(e){ prev = {}; }
      const picksOut = Object.assign({}, prev.picks || {});
      // Persist only the active class (if it was explicitly edited) and any
      // other class the player edited. Merely browsed classes are omitted.
      const ids = new Set(editedClasses);
      if (state.cls && editedClasses.has(state.cls)) ids.add(state.cls);
      ids.forEach((id) => { picksOut[id] = picksForPersist(id); });
      localStorage.setItem(storageKey(), JSON.stringify({
        race: state.race,
        cls: editedClasses.has(state.cls) ? state.cls : (prev.cls || null),
        picks: picksOut,
        characterId: state.characterId,
        updatedAt: state.updatedAt,
      }));
    }
  }catch(e){}
  // Push to Railway: selectedSkills is the class being played; every stored
  // class build is under skillLoadouts.<classId> (server shallow-merges by key).
  syncSkillTreeToCharacter();
}
function flattenPicks(picks){
  const out = {};
  Object.entries(picks || {}).forEach(([tier, skill])=>{
    if (skill != null) out[String(tier)] = typeof skill === "string" ? skill : (skill.n || skill.id || skill);
  });
  return out;
}
/** Every explicitly saved class in localStorage, plus this session's edited
 *  classes, with innates and empty browse-only entries stripped. */
function allPersistedExplicitPicks(){
  let stored = {};
  try { stored = (JSON.parse(localStorage.getItem(storageKey()) || "{}") || {}).picks || {}; } catch(e){ stored = {}; }
  const ids = new Set();
  Object.keys(stored || {}).forEach((id) => ids.add(canonicalClassId(id)));
  editedClasses.forEach((id) => ids.add(canonicalClassId(id)));
  const out = {};
  ids.forEach((cid) => {
    const innate = innateLevelsFor(cid);
    const storedPicks = stored[cid] || (cid === "worge" ? stored.worg : null) || {};
    const editedPicks = (state.picks && (state.picks[cid] != null ? state.picks[cid] : (cid === "worge" ? state.picks.worg : null)));
    const src = (editedClasses.has(cid) && editedPicks != null)
      ? editedPicks
      : storedPicks;
    const picks = {};
    Object.entries(src || {}).forEach(([lvl, v])=>{
      if (innate.has(String(lvl))) return;
      if (v != null) picks[lvl] = v;
    });
    if (Object.keys(picks).length) out[cid] = picks;
  });
  return out;
}
async function syncSkillTreeToCharacter(){
  try{
    if (!window.GrudgeFleet || !GrudgeFleet.isLoggedIn || !GrudgeFleet.isLoggedIn()) return;
    const id = activeCharId();
    if (!id || id === "guest") return;
    // Only sync after an explicit edit (not on browse). The payload itself
    // carries every persisted class so a server-side field replace cannot
    // wipe the others.
    const cls = state.cls;
    if (!cls || !editedClasses.has(cls)) return;
    const allPicks = allPersistedExplicitPicks();
    const classPicks = allPicks[cls] || picksForPersist(cls);
    // selectedSkills is only the class being played (server replaces this field).
    const selectedSkills = flattenPicks(classPicks);
    // Each class's build lives under skillLoadouts.<classId>. The server
    // shallow-merges that object by top-level key. classSkillPicks is not
    // stored by the server, so the same picks go inside that class's entry.
    const skillLoadouts = {
      _meta: { race: state.race, cls, characterId: id },
    };
    Object.entries(allPicks).forEach(([cid, picks])=>{
      skillLoadouts[cid] = {
        picks,
        classSkillPicks: picks,
        ...(cid === cls ? { race: state.race } : {}),
      };
    });
    await GrudgeFleet.saveCharacterProgress(id, {
      selectedSkills,
      skillLoadouts,
    });
  }catch(e){ console.warn("[skill-tree] sync:", e); }
}
async function hydrateFromCharacter(){
  try{
    if (!window.GrudgeFleet) return;
    await GrudgeFleet.init({ mode: "standalone" });
    if (!GrudgeFleet.isLoggedIn()) await GrudgeFleet.ensureSession?.();
    if (GrudgeFleet.isLoggedIn()) await GrudgeFleet.syncFromBackend?.();
    const id = activeCharId();
    if (!id || id === "guest") return;
    const char = await (GrudgeFleet.getCharacterDetail?.(id) || Promise.resolve(GrudgeFleet.getActiveCharacter?.()));
    if (!char) return;
    // Apply race/class from character
    if (char.race || char.raceId) {
      const r = String(char.race || char.raceId).toLowerCase();
      if (typeof RACES !== "undefined" && RACES[r]) state.race = r;
    }
    if (char.class || char.classId) {
      const c = String(char.class || char.classId).toLowerCase();
      // Exact CLASSES id wins. Legacy aliases only: worg→worge, rogue→thief,
      // and the Mage Priest display name → id mage.
      const mapped = canonicalClassId(c);
      if (typeof CLASSES !== "undefined" && CLASSES[mapped]) state.cls = mapped;
      else if (typeof CLASSES !== "undefined" && CLASSES[c]) state.cls = c;
    }
    if (char.selectedSkills && typeof char.selectedSkills === "object") {
      if (state.cls) {
        state.picks[state.cls] = state.picks[state.cls] || {};
        Object.entries(char.selectedSkills).forEach(([tier, skill])=>{
          state.picks[state.cls][tier] = skill;
        });
      }
    }
    // Restore every class stored under skillLoadouts.<classId> (and any
    // classSkillPicks nested in that entry). Do not read a top-level
    // classSkillPicks field — the server drops it.
    if (char.skillLoadouts && typeof char.skillLoadouts === "object") {
      Object.entries(char.skillLoadouts).forEach(([cid, entry])=>{
        if (!entry || typeof entry !== "object") return;
        if (cid === "_meta" || cid === "__progress") return;
        const id = canonicalClassId(cid);
        if (!id) return;
        const picks = entry.picks || entry.classSkillPicks;
        if (picks && typeof picks === "object") {
          state.picks[id] = { ...(state.picks[id] || {}), ...picks };
        }
      });
    }
    state.characterId = id;
    localStorage.setItem(storageKey(), JSON.stringify(state));
    if (typeof render === "function") render();
  }catch(e){ console.warn("[skill-tree] hydrate:", e); }
}
// Reload sheet when character changes
window.addEventListener("grudge:character:selected", ()=>{
  const fresh = load();
  if (fresh) Object.assign(state, fresh);
  else { state.picks = {}; state.cls = null; }
  hydrateFromCharacter();
});

/* -------- real skill icons -------- */

/* -------- safe DOM (no unescaped innerHTML of SSOT / pack text) -------- */
function safeUrl(s){
  if (!s) return "";
  const raw = String(s).trim();
  if (!raw) return "";
  // Reject backslashes, protocol-relative URLs, and /\… paths.
  // Do not resolve against a base: new URL("//x", origin) becomes https://x.
  if (raw.includes("\\") || raw.startsWith("//") || raw.startsWith("/\\")) return "";
  if (/^https?:\/\//i.test(raw)) {
    try {
      const u = new URL(raw);
      if (u.protocol === "http:" || u.protocol === "https:") return u.href;
    } catch(e){}
    return "";
  }
  // Same-origin path: a single leading slash, not // or /\
  if (raw.charAt(0) === "/" && raw.charAt(1) !== "/" && raw.charAt(1) !== "\\") {
    return encodeURI(raw);
  }
  return "";
}
if (typeof window !== "undefined") window.__safeUrl = safeUrl;

/** Reused from MolochDaGod/ObjectStore profession-trees.html `renderClassGraph`
 *  (preview dpl_FiBKimTbjuib46iW8FRu7KhLaiB9): mapX/mapY, PAD=40, parent-edge
 *  connectors, circle / square (path) / diamond (effect) node shapes, branch
 *  colors, reqLevel labels. Built with SVG DOM + textContent (Verdict: no
 *  innerHTML of data). Connector lines come from graph.node.parent in 3.1.0
 *  Unlock lines also use skill.requires from 3.1.0 (68 edges). Raider, thief,
 *  and verduror have no requires — parent only. */
function renderSkillGraph(host, c, k){
  const graph = c.graph;
  if (!graph || !graph.nodes || !graph.nodes.length) return;
  const wrap = document.createElement("div");
  wrap.className = "tree-graph-wrap";
  const legend = document.createElement("div");
  legend.className = "branch-legend";
  const lh = document.createElement("h3");
  lh.textContent = "Branches";
  legend.appendChild(lh);
  (graph.branches || []).forEach((b)=>{
    const item = document.createElement("div");
    item.className = "legend-item";
    const dot = document.createElement("div");
    dot.className = "legend-dot";
    if (b.color && b.color.stroke) dot.style.background = b.color.stroke;
    item.appendChild(dot);
    item.appendChild(document.createTextNode((b.name || "") + (b.nodeCount != null ? (" (" + b.nodeCount + ")") : "")));
    legend.appendChild(item);
  });
  const info = document.createElement("div");
  info.className = "graph-info";
  const nEl = document.createElement("div");
  nEl.className = "pi-name";
  nEl.textContent = c.name || k;
  const rEl = document.createElement("div");
  rEl.className = "pi-role";
  rEl.textContent = c.family || "";
  const cEl = document.createElement("div");
  cEl.className = "pi-count";
  cEl.textContent = (graph.totalNodes != null ? graph.totalNodes : graph.nodes.length) + " nodes";
  info.appendChild(nEl); info.appendChild(rEl); info.appendChild(cEl);
  const srcNote = document.createElement("div");
  srcNote.className = "graph-src";
  srcNote.textContent = "Layout and connectors reused from profession-trees renderTree / renderClassGraph. Names and unlocks from Spawn 3.1.0 (graph.parent and skill.requires).";
  const svg = svgEl("svg", { class: "tree-svg", width: "100%", height: "100%" });
  wrap.appendChild(legend);
  wrap.appendChild(info);
  wrap.appendChild(srcNote);
  wrap.appendChild(svg);
  host.appendChild(wrap);
  const W = svg.clientWidth || wrap.clientWidth || 800;
  const H = svg.clientHeight || 420;
  const PAD = 40;
  const mapX = (x) => PAD + (x / 100) * (W - PAD * 2);
  const mapY = (y) => PAD + ((100 - y) / 100) * (H - PAD * 2);
  const nodes = graph.nodes;
  /* Parent connectors: reused from profession-trees.html renderClassGraph :387–391
   * (and renderTree :250–254): line from parent node to child, branch stroke, opacity 0.5.
   * Built with SVG DOM instead of innerHTML. Names and coordinates come from 3.1.0 only. */
  const drawn = new Set();
  function drawEdge(from, to, color){
    if (!from || !to) return;
    const key = String(from.id) + "->" + String(to.id);
    if (drawn.has(key)) return;
    drawn.add(key);
    svg.appendChild(svgEl("line", {
      x1: mapX(from.x), y1: mapY(from.y),
      x2: mapX(to.x), y2: mapY(to.y),
      stroke: color || "#555", "stroke-width": "2", "stroke-opacity": "0.5",
    }));
  }
  nodes.forEach((node)=>{
    if (node.parent == null) return;
    const parent = nodes.find(n => n.id === node.parent);
    if (!parent) return;
    const color = (node.branchColor && node.branchColor.stroke) || "#555";
    drawEdge(parent, node, color);
  });
  /* Unlock lines from skill.requires (3.1.0). Raider, thief, and verduror have
   * no requires — their lines are parent-only. These edges are not the same as
   * parent (parent goes through path nodes); both are drawn, duplicates skipped. */
  (c.tiers || []).forEach((t)=>{
    (t.skills || []).forEach((sk)=>{
      if (!sk.requires || !sk.id) return;
      const from = nodes.find(n => n.skillId === sk.requires);
      const to = nodes.find(n => n.skillId === sk.id);
      if (!from || !to) return;
      const color = (to.branchColor && to.branchColor.stroke) || "#555";
      drawEdge(from, to, color);
    });
  });
  nodes.forEach((node)=>{
    const cx = mapX(node.x), cy = mapY(node.y);
    const color = (node.branchColor && node.branchColor.stroke) || c.color || "#d4a84b";
    const fill = (node.branchColor && node.branchColor.fill) || "rgba(212,168,75,0.15)";
    const r = node.path ? 11 : 16;
    let shape;
    if (node.nodeType === "effect") {
      shape = svgEl("polygon", {
        points: cx+","+(cy-r)+" "+(cx+r)+","+cy+" "+cx+","+(cy+r)+" "+(cx-r)+","+cy,
        fill, stroke: color, "stroke-width": "2",
        class: "graph-node", style: "cursor:pointer",
      });
    } else if (node.path) {
      shape = svgEl("rect", {
        x: cx-r, y: cy-r, width: r*2, height: r*2, rx: 3,
        fill, stroke: color, "stroke-width": "2",
        class: "graph-node", style: "cursor:pointer",
      });
    } else {
      shape = svgEl("circle", {
        cx, cy, r, fill, stroke: color, "stroke-width": "2",
        class: "graph-node", style: "cursor:pointer",
      });
    }
    if (node.id != null) shape.setAttribute("data-id", String(node.id));
    if (node.skillId) shape.setAttribute("data-skill-id", node.skillId);
    svg.appendChild(shape);
    const rawName = node.name || "";
    const label = rawName.length > 16 ? rawName.substring(0, 14) + "…" : rawName;
    const tx = svgEl("text", {
      x: cx, y: cy+r+14, "text-anchor": "middle",
      fill: color, "font-family": "Cinzel,serif", "font-size": "9",
      "font-weight": "600", opacity: "0.8",
    });
    tx.textContent = label;
    svg.appendChild(tx);
    if (node.reqLevel > 0) {
      const lv = svgEl("text", {
        x: cx+r+4, y: cy-r+4, fill: "#ef4444", "font-size": "8",
        "font-family": "Cinzel,serif", opacity: "0.7",
      });
      lv.textContent = "Lv" + node.reqLevel;
      svg.appendChild(lv);
    }
    const onEnter = (e)=>{
      const skill = (c.tiers || []).flatMap(t => (t.skills||[]).map(s => ({s,t}))).find(x => x.s.id === node.skillId || x.s.n === node.name);
      if (skill) showTip(e, skill.s, skill.t);
      else {
        // Path / non-skill graph nodes: show name and description from the graph only.
        showTip(e, { n: node.name || "", d: node.description || "", icon: "", stats: {} }, { lvl: node.reqLevel, label: "" });
      }
    };
    shape.addEventListener("mouseenter", onEnter);
    shape.addEventListener("mousemove", (e)=>{ if (typeof showTip === "function") {/* tip follows via showTip */} });
    shape.addEventListener("mouseleave", hideTip);
    if (node.skillId && !node.path) {
      shape.addEventListener("click", ()=>{
        const found = (c.tiers || []).flatMap(t => (t.skills||[]).map(s => ({s,t}))).find(x => x.s.id === node.skillId);
        if (!found) return;
        togglePick(k, found.t.lvl, found.s.n, found.t.picks);
      });
    }
  });
}

function isInnateDisplay(t){
  return !!(t && t.auto && !t.catalog);

function isPicked(k,lvl,name,t){
  if (isInnateDisplay(t)) return (t.skills || []).some(s => s.n === name);
  const arr = (state.picks[k]||{})[lvl]||[];
  return arr.includes(name);
}
function togglePick(k,lvl,name,picks){
  state.picks[k] = state.picks[k]||{};
  let arr = state.picks[k][lvl]||[];
  if(arr.includes(name)){
    arr = arr.filter(x=>x!==name);
  } else {
    arr.push(name);
    // Cap only when the data file itself gives a per-tier pick count.
    if (picks != null && picks > 0) {
      while(arr.length>picks) arr.shift();
    }
  }
  state.picks[k][lvl] = arr;
  markEdited(k);
  save();
  render();
}

    b.textContent = names;
    const em = document.createElement("em");
    em.textContent = t.auto ? "auto" : (t.catalog ? "catalog" : ("pick " + (t.picks||1)));
    line.appendChild(dot);
    line.appendChild(lbl);
    line.appendChild(b);
    line.appendChild(em);
    buildEl.appendChild(line);
  });

  // progress
  const need = c.tiers.filter(t=>!t.auto && !t.catalog).reduce((a,t)=>a+(t.picks||1),0);
  const got  = c.tiers.filter(t=>!t.auto && !t.catalog).reduce((a,t)=>{
    return a+((state.picks[k]||{})[t.lvl]||[]).length;
  },0);
  const pct = need? Math.min(100,(got/need)*100) : 0;
  progEl.style.width = pct+"%";
  confirmBtn.disabled = got<need;
}

/* -------- tooltip -------- */
function renderWorgeGrimoire(parent){
  if (state.cls !== "worge") return;
  const G = window.GRUDGE_WORGE_GRIMOIRE;
  if (!G || !G.FORMS) return;
  const box = document.createElement("div");
  box.className = "grimoire-box";
  const title = document.createElement("div");
  title.className = "g-title";
  title.textContent = G.name || "Grimoire of Forms";
  const src = document.createElement("div");
  src.className = "g-src";
  const srcFile = (G.source && G.source.file) || "grimoire-forms.js";
  const srcCommit = (G.source && G.source.spawnCommit) || "";
  src.textContent = "Spawn " + srcFile + (srcCommit ? (" @" + srcCommit.slice(0,7)) : "") + " — F forms as written, not edited.";
  const lead = document.createElement("div");
  lead.className = "g-lead";
  lead.textContent = (G.fChanges || "") + (G.bookLead ? (" " + G.bookLead) : "");
  box.appendChild(title);
  box.appendChild(src);
  box.appendChild(lead);
  const fh = document.createElement("div");
  fh.className = "g-h";
  fh.textContent = "Forms";
  box.appendChild(fh);
  const ful = document.createElement("ul");
  (G.FORMS || []).forEach((f)=>{
    const li = document.createElement("li");
    const parts = [];
    if (f.level != null) parts.push("L" + f.level);
    if (f.name) parts.push(f.name);
    if (f.role) parts.push("· " + f.role);
    li.textContent = parts.join(" ");
    ful.appendChild(li);
  });
  box.appendChild(ful);
  const sh = document.createElement("div");
  sh.className = "g-h";
  sh.textContent = "Spells";
  box.appendChild(sh);
  const sul = document.createElement("ul");
  (G.SPELLS || []).forEach((s)=>{
    const li = document.createElement("li");
    const parts = [];
    if (s.level != null) parts.push("L" + s.level);
    if (s.name) parts.push(s.name);
    if (s.text) parts.push("— " + s.text);
    li.textContent = parts.join(" ");
    sul.appendChild(li);
  });
  box.appendChild(sul);
  parent.appendChild(box);
}
function showTip(e,s,t){
  const iconPath = s.icon || iconFor(state.cls, s.n);
  tip.replaceChildren();
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;gap:10px;align-items:flex-start";
  const src = safeUrl(iconPath);
  if (src) {
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.setAttribute("src", src);
    img.setAttribute("alt", s.n || "");
    thumb.appendChild(img);
    wrap.appendChild(thumb);
  }
  const body = document.createElement("div");
  body.style.flex = "1";
  const title = document.createElement("b");
  title.textContent = s.n || "";
  const lv = document.createElement("span");
  lv.style.cssText = "color:var(--mute);font-size:11px";
  lv.textContent = " · Lv " + t.lvl;
  body.appendChild(title);
  body.appendChild(document.createTextNode(" "));
  body.appendChild(lv);
  const desc = document.createElement("div");
  desc.style.marginTop = "6px";
  desc.textContent = s.d || "";
  body.appendChild(desc);
  const row = document.createElement("div");
  row.className = "row";
  Object.entries(s.stats || {}).forEach(([sk,sv])=>{
    const span = document.createElement("span");
    span.textContent = sk + ": " + sv;
    row.appendChild(span);
  });
  body.appendChild(row);
  wrap.appendChild(body);
  tip.appendChild(wrap);
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  if(x+300>innerWidth) x = e.clientX - 300 - pad;
  if(y+200>innerHeight) y = e.clientY - 200 - pad;
  tip.style.left = x+"px"; tip.style.top = y+"px";
  tip.classList.add("show");
}
function hideTip(){ tip.classList.remove("show"); }

/* -------- actions -------- */
confirmBtn.onclick = ()=>{
  const k = state.cls; if(!k) return;
  curtain.classList.add("show");
  setTimeout(()=>curtain.classList.remove("show"),900);
  const raceName = state.race ? RACES[state.race].name+" " : "";
  toastEl.textContent = "âš” "+raceName+CLASSES[k].name+" Build Locked";
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1900);
  console.log("Locked build:", {race:state.race, class:k, picks:state.picks[k]});
};
randomBtn.onclick = ()=>{
  const k = state.cls; if(!k) return;
  const c = CLASSES[k];
  state.picks[k] = {};
  c.tiers.forEach(t=>{
    if(t.auto){ return; } // innate: display-only, not stored
    const picks = t.picks||1;
    const pool = [...t.skills].sort(()=>Math.random()-.5).slice(0,picks).map(s=>s.n);
    state.picks[k][t.lvl] = pool;
  });
  markEdited(k);
  save(); render();
};
resetBtn.onclick = ()=>{
  if(!confirm("Reset race, class, and all selections?")) return;
  Object.assign(state,{race:null,cls:null,picks:{}});
  save({ reset: true });
  document.querySelectorAll(".stage .bg").forEach(b=>b.classList.remove("active"));
  render();
};

/* -------- main render -------- */
function render(){ renderRaces(); renderPicker(); renderTree(); renderSide(); updateCharBanner(); }
window.addEventListener("resize", ()=>{ if (state.cls) renderTree(); });
function updateCharBanner(){
  let el = document.getElementById("char-banner");
  if (!el) {
    el = document.createElement("div");
    el.id = "char-banner";
    el.style.cssText = "position:fixed;top:10px;right:12px;z-index:50;font:12px Inter,sans-serif;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.7);border:1px solid rgba(246,201,69,.35);color:#f6c945";
    document.body.appendChild(el);
  }
  const id = activeCharId();
  const char = window.GrudgeFleet?.getActiveCharacter?.();
  el.replaceChildren();
  if (char) {
    el.appendChild(document.createTextNode("⚔ " + (char.name || id) + " · skills bound to "));
    const code = document.createElement("code");
    code.style.color = "#ffd98a";
    code.textContent = String(id).slice(0, 8) + "…";
    el.appendChild(code);
  } else if (id && id !== "guest") {
    el.appendChild(document.createTextNode("Character "));
    const code = document.createElement("code");
    code.style.color = "#ffd98a";
    code.textContent = String(id).slice(0, 8) + "…";
    el.appendChild(code);
  } else {
    el.textContent = "Not signed in — picks save locally only";
  }
}
if(state.cls) setBg(state.cls);
render();
// Hydrate from Grudge UUID after fleet loads
(async () => { await hydrateFromCharacter(); render(); })();
</script>
