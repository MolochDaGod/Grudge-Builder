<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grudge Studio | AI Lab</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0b1120; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .panel { background: #1e293b; border: 1px solid #334155; }
        .panel:hover { border-color: #6366f1; }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        .input-dark { background: #0f172a; border: 1px solid #334155; color: white; }
        .input-dark:focus { border-color: #6366f1; outline: none; }
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #6366f1; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-6 grid gap-6 grid-cols-1 lg:grid-cols-2 max-w-7xl mx-auto">

    <header class="col-span-1 lg:col-span-2 flex justify-between items-center mb-4">
        <div>
            <h1 class="text-3xl font-black text-indigo-400 tracking-tight">GRUDGE <span class="text-white">AI LAB</span></h1>
            <p class="text-slate-400 text-sm">Powered by Puter.js Neural Cloud</p>
        </div>
        <div class="flex gap-3">
            <span id="status" class="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700 flex items-center gap-2">
                <div class="h-2 w-2 rounded-full bg-emerald-500"></div> System Online
            </span>
        </div>
    </header>

    <section class="panel rounded-xl p-6 flex flex-col gap-4">
        <div class="flex items-center gap-3 border-b border-slate-700 pb-4">
            <div class="bg-blue-500/10 p-2 rounded text-blue-400"><i class="fa-solid fa-code"></i></div>
            <h2 class="font-bold text-lg">Code Architect</h2>
        </div>
        <div class="flex-grow space-y-3">
            <p class="text-xs text-slate-400">Ask for help with Phaser, Three.js, or backend logic.</p>
            <textarea id="code-prompt" class="w-full h-32 input-dark p-3 rounded-lg text-sm font-mono" placeholder="// Paste your broken code here or ask a question..."></textarea>
            <div class="flex gap-2">
                <select id="code-model" class="input-dark px-3 py-2 rounded text-xs" aria-label="Select AI model for code analysis">
                    <option value="claude-3-5-sonnet">Claude 3.5 Sonnet (Best for Code)</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="deepseek-chat">DeepSeek V3</option>
                </select>
                <button onclick="runCodeTutor()" class="btn-primary px-4 py-2 rounded text-sm font-bold flex-grow flex justify-center items-center gap-2">
                    <div id="loader-code" class="loader"></div> <span>Analyze Code</span>
                </button>
            </div>
            <div id="code-output" class="bg-black/50 p-3 rounded-lg text-xs font-mono text-green-400 h-40 overflow-y-auto whitespace-pre-wrap hidden"></div>
        </div>
    </section>

    <section class="panel rounded-xl p-6 flex flex-col gap-4">
        <div class="flex items-center gap-3 border-b border-slate-700 pb-4">
            <div class="bg-purple-500/10 p-2 rounded text-purple-400"><i class="fa-solid fa-image"></i></div>
            <h2 class="font-bold text-lg">Texture Synthesis</h2>
        </div>
        <div class="flex-grow space-y-3">
            <p class="text-xs text-slate-400">Generate seamless assets for game environments.</p>
            <input type="text" id="img-prompt" class="w-full input-dark p-3 rounded-lg text-sm" placeholder="e.g., seamless stone wall texture, dark fantasy style">
            <button onclick="generateTexture()" class="btn-primary px-4 py-2 rounded text-sm font-bold w-full flex justify-center items-center gap-2">
                <div id="loader-img" class="loader"></div> <span>Generate Texture</span>
            </button>
            <div id="img-result" class="h-48 bg-black/30 rounded-lg flex items-center justify-center border border-dashed border-slate-700 overflow-hidden">
                <span class="text-slate-600 text-xs">Preview Area</span>
            </div>
        </div>
    </section>

    <section class="panel rounded-xl p-6 flex flex-col gap-4">
        <div class="flex items-center gap-3 border-b border-slate-700 pb-4">
            <div class="bg-pink-500/10 p-2 rounded text-pink-400"><i class="fa-solid fa-microphone-lines"></i></div>
            <h2 class="font-bold text-lg">NPC Voice Studio</h2>
        </div>
        <div class="flex-grow space-y-3">
            <input type="text" id="tts-text" class="w-full input-dark p-3 rounded-lg text-sm" placeholder="Enter NPC dialogue here...">
            <div class="flex gap-2">
                <select id="tts-voice" class="input-dark px-3 py-2 rounded text-xs w-1/3" aria-label="Select voice for text-to-speech">
                    <option value="alloy">Alloy (Neutral)</option>
                    <option value="echo">Echo (Male)</option>
                    <option value="fable">Fable (British)</option>
                    <option value="onyx">Onyx (Deep)</option>
                    <option value="nova">Nova (Fem)</option>
                    <option value="shimmer">Shimmer (Clear)</option>
                </select>
                <button onclick="generateVoice()" class="btn-primary px-4 py-2 rounded text-sm font-bold flex-grow flex justify-center items-center gap-2">
                    <div id="loader-voice" class="loader"></div> <span>Generate Audio</span>
                </button>
            </div>
            <div id="audio-container" class="mt-2"></div>
        </div>
    </section>

    <section class="panel rounded-xl p-6 flex flex-col gap-4">
        <div class="flex items-center gap-3 border-b border-slate-700 pb-4">
            <div class="bg-emerald-500/10 p-2 rounded text-emerald-400"><i class="fa-solid fa-eye"></i></div>
            <h2 class="font-bold text-lg">Asset Inspector</h2>
        </div>
        <div class="flex-grow space-y-3">
            <p class="text-xs text-slate-400">Describe or critique an uploaded image.</p>
            <div class="flex gap-2">
                <input type="file" id="vision-upload" class="text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600" aria-label="Upload image for analysis"/>
                <button onclick="analyzeImage()" class="btn-primary px-4 py-2 rounded text-sm font-bold" type="button" aria-label="Analyze uploaded image">
                    <i class="fa-solid fa-search"></i>
                </button>
            </div>
            <div id="vision-output" class="bg-black/50 p-3 rounded-lg text-xs h-32 overflow-y-auto hidden"></div>
        </div>
    </section>

    <script>
        // 1. CODE TUTOR LOGIC
        async function runCodeTutor() {
            const prompt = document.getElementById('code-prompt').value;
            if(!prompt) return alert("Please enter code or a question.");
            
            const loader = document.getElementById('loader-code');
            const output = document.getElementById('code-output');
            const model = document.getElementById('code-model').value;

            loader.style.display = 'block';
            output.classList.add('hidden');

            try {
                // Factual Example: https://docs.puter.com/playground/ai-chat-claude/
                const resp = await puter.ai.chat(
                    `You are a senior game developer for Grudge Studio. Help the user with this request using concise, modern code: ${prompt}`, 
                    { model: model }
                );
                output.innerText = resp;
                output.classList.remove('hidden');
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        // 2. TEXTURE GENERATOR LOGIC
        async function generateTexture() {
            const prompt = document.getElementById('img-prompt').value;
            if(!prompt) return alert("Enter a texture description.");

            const loader = document.getElementById('loader-img');
            const container = document.getElementById('img-result');
            
            loader.style.display = 'block';
            container.innerHTML = '<span class="text-slate-500 animate-pulse">Synthesizing...</span>';

            try {
                // Factual Example: https://docs.puter.com/playground/ai-txt2img/
                const image = await puter.ai.txt2img(prompt);
                container.innerHTML = `<img src="${image.src}" class="w-full h-full object-cover cursor-pointer" onclick="window.open(this.src)">`;
            } catch (err) {
                container.innerHTML = `<span class="text-red-400 text-xs">Error: ${err.message}</span>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        // 3. VOICE STUDIO LOGIC
        async function generateVoice() {
            const text = document.getElementById('tts-text').value;
            if(!text) return alert("Enter dialogue text.");

            const loader = document.getElementById('loader-voice');
            const voice = document.getElementById('tts-voice').value;
            
            loader.style.display = 'block';

            try {
                // Factual Example: https://docs.puter.com/playground/ai-txt2speech-openai/
                const audio = await puter.ai.txt2speech(text, { engine: 'openai', voice: voice });
                const audioPlayer = document.createElement('audio');
                audioPlayer.src = audio.src;
                audioPlayer.controls = true;
                audioPlayer.className = "w-full mt-2";
                
                const container = document.getElementById('audio-container');
                container.innerHTML = '';
                container.appendChild(audioPlayer);
                audioPlayer.play();
            } catch (err) {
                alert("TTS Error: " + err.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        // 4. VISION ANALYZER LOGIC
        async function analyzeImage() {
            const fileInput = document.getElementById('vision-upload');
            if(fileInput.files.length === 0) return alert("Select an image first.");

            const file = fileInput.files[0];
            const reader = new FileReader();
            const output = document.getElementById('vision-output');
            
            output.innerText = "Analyzing pixel data...";
            output.classList.remove('hidden');

            reader.onload = async function(e) {
                try {
                    // Factual Example: https://docs.puter.com/playground/ai-gpt-vision/
                    const imgElement = document.createElement('img');
                    imgElement.src = e.target.result;
                    
                    const response = await puter.ai.chat(
                        "Analyze this game asset. Describe its style, color palette, and suggest one improvement for a dark fantasy game.", 
                        [imgElement]
                    );
                    output.innerText = response;
                } catch (err) {
                    output.innerText = "Vision Error: " + err.message;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
