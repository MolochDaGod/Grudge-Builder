# Production auth edge — id.grudge-studio.com
# Proxies fleet auth paths to Railway grudge-api; SPA catch-all → /login.
#
# Live CF Worker script name is grudge-identity-api (route owner for id.*).
# grudge-id-gateway is a historical alias; do not re-bind the route to it.
name = "grudge-identity-api"
main = "src/index.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ee475864561b02d4588180b8b9acf694"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (if any): wrangler secret put … — JWT validation is upstream Railway.
# Route already attached in CF dashboard; re-declaring fails with 10020 if another
# script ever held it. Deploy script updates code; route stays on this worker.
# [[routes]]
# pattern = "id.grudge-studio.com/*"
# zone_name = "grudge-studio.com"

[vars]
ENVIRONMENT = "production"
UPSTREAM = "https://grudge-api-production-0d46.up.railway.app"
PUBLIC_HOST = "https://id.grudge-studio.com"
# Comma-separated extra return/CORS hosts (exact hostnames, no wildcards, no scheme).
# Empty by default; set per-environment without a code change. Not a secret.
AUTH_ALLOWED_RETURN_HOSTS = ""
