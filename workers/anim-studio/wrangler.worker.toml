name = "anim-studio"
main = "src/worker.js"
compatibility_date = "2025-03-01"
account_id = "ee475864561b02d4588180b8b9acf694"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# All requests hit Worker first so /api proxy works (assets via env.ASSETS)
run_worker_first = true

[vars]
ENVIRONMENT = "production"
AI_UPSTREAM = "https://anim-ai-worker.grudge.workers.dev"

# Custom domain (auto DNS) + zone route for /* traffic
[[routes]]
pattern = "anim.grudge-studio.com"
custom_domain = true

[[routes]]
pattern = "anim.grudge-studio.com/*"
zone_id = "e8c0c2ee3063f24eb31affddabf9730a"
