# Production wallet edge — wallet.grudge-studio.com
# Single top-level env (no [env.production] duplicate — that made wrangler
# warn and skip a clean modules bundle).
name = "grudge-wallet-site"
main = "src/index.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ee475864561b02d4588180b8b9acf694"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[routes]]
pattern = "wallet.grudge-studio.com/*"
zone_name = "grudge-studio.com"

[vars]
ENVIRONMENT = "production"
RAILWAY_API_ORIGIN = "https://grudge-api-production-0d46.up.railway.app"
ID_GATEWAY_ORIGIN = "https://id.grudge-studio.com"
ASSETS_CDN = "https://assets.grudge-studio.com"
CLIENT_ORIGIN = "https://client.grudge-studio.com"
PORTAL_ORIGIN = "https://grudge-studio.com"
POKER_ORIGIN = "https://poker.grudge-studio.com"
TRADER_ORIGIN = "https://trader.grudge-studio.com"
