# Nixpacks configuration for Railway
# Ensures the Express server is built and started (not npx serve)

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
cmds = ["npm install --legacy-peer-deps --include=dev"]

[phases.build]
cmds = ["npm run build:server"]

[start]
cmd = "NODE_ENV=production npm run db:push && node dist/index.js"
